  .dots { display:flex; gap:3px; flex-wrap:wrap; justify-content:center; max-width:90%; }

  .legend { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:12px; color:var(--text-mid); }
  .legend span { display:flex; align-items:center; gap:5px; }
  .sq { width:12px; height:12px; border-radius:4px; display:inline-block; }

  .sheet-bg { position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(2,6,23,.6); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { width:100%; max-width:560px; max-height:88vh; overflow-y:auto; border-radius:22px 22px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 18px); animation:fadeUp .25s ease both; }
  .sheet-grip { width:44px; height:5px; border-radius:9px; background:var(--border-soft); margin:0 auto 12px; }
  .ev { border-radius:14px; padding:12px; border:1px solid var(--border-soft); background:rgba(148,163,184,.06); border-left:5px solid var(--mine); }
  .avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#fff; flex-shrink:0; }
  .list { display:grid; gap:8px; }

  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); transform:translateX(-50%); z-index:60; padding:11px 16px; border-radius:12px; background:#111827; border:1px solid var(--border-soft); font-size:14px; font-weight:700; box-shadow:0 10px 30px -10px #000; animation:fadeUp .25s ease both; max-width:90vw; text-align:center; }
  table.t { width:100%; border-collapse:collapse; font-size:13px; }
  table.t td { padding:7px 4px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
</style>

<script>
const html = htm.bind(React.createElement);
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const APP_VERSION = '2026-10-11.20';
const DEV = { login:'paulo', password:'221844', name:'Paulo' };
const COL = { cantores:'agenda_cantores', grupos:'agenda_grupos', eventos:'agenda_eventos', log:'agenda_log' };
const CACHE_KEY = 'am_cache_v1';
const SESSION_KEY = 'am_session_v1';
const SEEN_KEY = 'am_avisos_seen_v1';

const PERIODOS = [
  { id:'manha', label:'Manhã', ic:'🌅' },
  { id:'tarde', label:'Tarde', ic:'☀️' },
  { id:'noite', label:'Noite', ic:'🌙' },
  { id:'dia',   label:'Dia todo', ic:'📅' },
];
const PER = Object.fromEntries(PERIODOS.map(p => [p.id, p]));
const TIPOS = ['Dueto','Trio','Quarteto','Quinteto','Grupo vocal','Coral','Banda','Outro'];
const CORES = ['#3b82f6','#8b5cf6','#10b981','#f59e0b','#06b6d4','#ef4444','#14b8a6','#a855f7','#84cc16','#f97316'];
const SOLO_COLOR = '#ec4899';
const BLOCK_COLOR = '#64748b';
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW = ['D','S','T','Q','Q','S','S'];
const DOW_LONG = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

// ---------- utilidades ----------
function simpleHash(str) {
  const s = 'am-salt-2026::' + String(str || '');
  let h1 = 0x811c9dc5, h2 = 0xdeadbeef;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2654435761); }
  return (h1>>>0).toString(16).padStart(8,'0') + (h2>>>0).toString(16).padStart(8,'0');
}
const uid = (p) => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = (n) => String(n).padStart(2,'0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const parseYmd = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtDate = (s) => { const d = parseYmd(s); return pad(d.getDate()) + '/' + pad(d.getMonth()+1); };
const fmtDateLong = (s) => { const d = parseYmd(s); return DOW_LONG[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()].toLowerCase(); };
const initials = (n) => (n||'?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
const normLogin = (s) => (s||'').trim().toLowerCase().replace(/\s+/g,'.').normalize('NFD').replace(/[̀-ͯ]/g,'');
const overlap = (a, b) => a === 'dia' || b === 'dia' || a === b;
const onlyDigits = (s) => (s||'').replace(/\D/g,'');
function waLink(phone, text) {
  let d = onlyDigits(phone); if (!d) return null;
  if (d.length <= 11) d = '55' + d;
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(text || '');
}

// ---------- distância e custo de deslocamento ----------
// Usa mapas abertos e gratuitos (OpenStreetMap pra achar o endereço, OSRM pra rota de carro).
// Não precisa de chave nem de cartão. O botão "ver rota" abre a mesma viagem no Google Maps.
const brl = (v) => (Number(v) || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const parseMoney = (s) => { const n = parseFloat(String(s || '').replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',', '.')); return isNaN(n) ? 0 : n; };
const geoCache = {};
async function geocode(q) {
  const key = (q || '').trim().toLowerCase();
  if (!key) throw new Error('vazio');
  if (geoCache[key]) return geoCache[key];
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&accept-language=pt-BR&q=' + encodeURIComponent(q));
  const j = await r.json();
  if (!j || !j.length) throw new Error('nao-achou');
  return (geoCache[key] = { lat: +j[0].lat, lon: +j[0].lon, label: j[0].display_name });
}
async function routeKm(a, b) {
  const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`);
  const j = await r.json();
  if (!j.routes || !j.routes.length) throw new Error('sem-rota');
  return { km: j.routes[0].distance / 1000, min: j.routes[0].duration / 60 };
}
function costOf(cfg, kmOneWay) {
  const kmTotal = kmOneWay * (cfg.idaVolta === false ? 1 : 2);
  const desloc = kmTotal * (Number(cfg.valorKm) || 0);
  const total = desloc + (Number(cfg.extra) || 0);
  return { kmTotal, desloc, total: Math.max(total, Number(cfg.minimo) || 0) };
}
// Calcula tudo a partir do endereço da igreja; o ponto de saída já vem salvo no grupo.
async function quoteFor(cfg, destino) {
  const from = (cfg.lat && cfg.lon) ? { lat: cfg.lat, lon: cfg.lon } : await geocode(cfg.origem);
  const to = await geocode(destino);
  const { km, min } = await routeKm(from, to);
  return { km, min, ...costOf(cfg, km), destinoLabel: to.label };
}
const mapsLink = (from, to) => 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=' + encodeURIComponent(from || '') + '&destination=' + encodeURIComponent(to || '');
const bookingLink = (gid) => location.origin + location.pathname + '?agendar=' + encodeURIComponent(gid);
const soloLink = (login) => location.origin + location.pathname + '?solo=' + encodeURIComponent(login);
// O cantor solo é tratado como um "grupo de uma pessoa só" nas telas de agendamento público.
function soloTarget(st, login) {
  const c = st.cantores[login];
  if (!c || c.removed || c.paused) return null;

// ---------- banco de dados (nuvem + cópia local) ----------
// Tudo que é mudado vai direto pra nuvem (Firestore) — não existe botão "Salvar geral".
// Uma cópia fica guardada no aparelho pra abrir rápido e funcionar sem internet;
// quando a internet volta, o Firestore envia sozinho o que ficou pendente.
const Store = (() => {
  let state = { cantores:{}, grupos:{}, eventos:{}, log:{} };
  try { const raw = localStorage.getItem(CACHE_KEY); if (raw) state = { ...state, ...JSON.parse(raw) }; } catch(e) {}
  let status = window.__LOCAL_MODE__ ? 'local' : 'conectando';
  let pending = {};
  const subs = new Set();
  let saveT = null;
  const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch(e) {} }, 250); };
  const emit = () => { persist(); subs.forEach(f => f()); };
  const isCloud = () => !!(window.__fb && window.__fb.ready);

  function startCloud() {
    const { collection, onSnapshot } = window.__fb.h;
    const db = window.__fb.db;
    Object.entries(COL).forEach(([key, name]) => {
      onSnapshot(collection(db, name), { includeMetadataChanges:true }, (snap) => {
        const next = {};
        snap.forEach(d => { next[d.id] = { ...d.data(), id:d.id }; });
        state = { ...state, [key]: next };
        pending[key] = snap.metadata.hasPendingWrites;
        const anyPending = Object.values(pending).some(Boolean);
        status = anyPending ? 'salvando' : (snap.metadata.fromCache ? 'offline' : 'nuvem');
        emit();
      }, (err) => { status = 'erro'; console.error(err); emit(); });
    });
  }
  if (isCloud()) startCloud();
  else window.addEventListener('fb-ready', startCloud, { once:true });
  window.addEventListener('fb-error', () => { if (!isCloud()) { status = 'local'; emit(); } }, { once:true });
  window.addEventListener('online', () => emit());
  window.addEventListener('offline', () => { if (status === 'nuvem') status = 'offline'; emit(); });
  // No modo local, outra aba do mesmo aparelho também vê a mudança.
  window.addEventListener('storage', (e) => { if (e.key === CACHE_KEY && !isCloud() && e.newValue) { try { state = JSON.parse(e.newValue); subs.forEach(f => f()); } catch(_){} } });

  const localSet = (key, id, obj) => { state = { ...state, [key]: { ...state[key], [id]: { ...obj, id } } }; emit(); };
  const localDel = (key, id) => { const c = { ...state[key] }; delete c[id]; state = { ...state, [key]: c }; emit(); };
  const clean = (o) => JSON.parse(JSON.stringify(o)); // tira undefined (Firestore não aceita)

  return {
    get: () => state,
    status: () => status,
    subscribe: (f) => { subs.add(f); return () => subs.delete(f); },
    async set(key, id, obj) {
      const data = clean({ ...obj, updatedAt: Date.now() }); delete data.id;
      if (!isCloud()) { localSet(key, id, data); return true; }
      localSet(key, id, data); // mostra na hora, antes da nuvem confirmar
      const { doc, setDoc } = window.__fb.h;
      try { await setDoc(doc(window.__fb.db, COL[key], id), data); return true; } catch(e) { console.error(e); status='erro'; emit(); return false; }
    },
    async update(key, id, fields) {
      const cur = state[key][id] || {};
      const data = clean({ ...fields, updatedAt: Date.now() });
      if (!isCloud()) { localSet(key, id, { ...cur, ...data }); return true; }
      localSet(key, id, { ...cur, ...data });
      const { doc, setDoc } = window.__fb.h;
      try { await setDoc(doc(window.__fb.db, COL[key], id), data, { merge:true }); return true; } catch(e) { console.error(e); status='erro'; emit(); return false; }
    },
    async remove(key, id) {
      if (!isCloud()) { localDel(key, id); return true; }
      localDel(key, id);
      const { doc, deleteDoc } = window.__fb.h;
      try { await deleteDoc(doc(window.__fb.db, COL[key], id)); return true; } catch(e) { console.error(e); return false; }
    },
    // Cadastro de cantor usa o próprio usuário como ID do documento e uma transação:
    // dois cadastros com o mesmo usuário, mesmo ao mesmo tempo, nunca criam duplicado.
    async createCantor(login, obj) {
      const data = clean({ ...obj, updatedAt: Date.now() });
      if (!isCloud()) {
        const ex = state.cantores[login];
        if (ex && !ex.removed) return { taken:true };
        localSet('cantores', login, data); return { ok:true };
      }
      const { doc, runTransaction } = window.__fb.h;
      const ref = doc(window.__fb.db, COL.cantores, login);
      let taken = false;
      try {
        await runTransaction(window.__fb.db, async (tx) => {
          const s = await tx.get(ref);
          if (s.exists() && !s.data().removed) { taken = true; return; }
          tx.set(ref, data);
        });
      } catch(e) { console.error(e); return { error:true }; }
      if (!taken) localSet('cantores', login, data);
      return taken ? { taken:true } : { ok:true };
    },
    // Observação nova num compromisso: usa arrayUnion, então duas pessoas escrevendo ao mesmo
    // tempo não apagam a observação uma da outra.
    async addObs(evId, obs) {
      const cur = state.eventos[evId]; if (!cur) return false;
      localSet('eventos', evId, { ...cur, obs: [...(cur.obs || []), obs] });
      if (!isCloud()) return true;
      const { doc, setDoc, arrayUnion } = window.__fb.h;
      try { await setDoc(doc(window.__fb.db, COL.eventos, evId), { obs: arrayUnion(obs) }, { merge:true }); return true; } catch(e) { console.error(e); status='erro'; emit(); return false; }
    },
    log(type, who, detail) {
      const id = uid('log');
      this.set('log', id, { type, who: who || '', detail: detail || '', at: Date.now() });
    }
  };
})();

function useStore() {
  const [, force] = useState(0);

}

  const [s, setS] = useState(Store.status());
  useEffect(() => Store.subscribe(() => setS(Store.status())), []);
  return s;
}

const activeCantores = (st) => Object.values(st.cantores).filter(c => !c.removed && !c.isGroup);
// Conta do grupo: login próprio do grupo (guardado junto das contas, com isGroup + groupId).

const canManage = (st, g, me) => !!g && !!me && (g.account === me || (g.members||[]).includes(me));
const activeGrupos = (st) => Object.values(st.grupos).filter(g => !g.removed);
const myGroups = (st, login) => activeGrupos(st).filter(g => (g.members||[]).includes(login) || (login && g.account === login)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));

// Quem participa de um compromisso. Em grupo, são os integrantes ATUAIS (menos quem ficou
// de fora por ter substituto) — assim, se alguém entra no grupo depois, já fica ocupado também.
function participantsOf(st, ev) {
  if (ev.ownerType === 'grupo') {
    const g = st.grupos[ev.ownerId];
    if (!g || g.removed) return [];
    return (g.members||[]).filter(m => !(ev.excluded||[]).includes(m));
  }
  return [ev.ownerId];
}
const isEnsaio = (ev) => ev && ev.kind === 'ensaio';

// Datas de uma recorrência: semanal, quinzenal ou mensal (mesmo dia do mês).
// Ensaios por semana: dias da semana escolhidos (0=Dom … 6=Sáb), por N semanas, toda semana ou a cada 2.
function weekDates(start, dias, weeks, every) {
  const out = []; const d0 = parseYmd(start);
  const sun = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() - d0.getDay());
  for (let w = 0; w < weeks; w++) {
    for (const wd of [...dias].sort()) {
      const d = new Date(sun.getFullYear(), sun.getMonth(), sun.getDate() + w * 7 * (every || 1) + wd);
      if (d >= d0) out.push(ymd(d));
    }
  }
  return out;
}
const DOW3 = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function recurDates(start, freq, count) {
  const out = []; const d0 = parseYmd(start);
  for (let i = 0; i < count; i++) {
    let d;
    if (freq === 'mensal') { d = new Date(d0.getFullYear(), d0.getMonth() + i, d0.getDate()); if (d.getDate() !== d0.getDate()) continue; }
    else d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + i * (freq === 'quinzenal' ? 14 : 7));
    out.push(ymd(d));
  }
  return out;
}
const REPS = [['nao','Não repete'],['semanal','Toda semana'],['quinzenal','A cada 2 semanas'],['mensal','Todo mês']];
function evTitle(st, ev) {
  if (ev.kind === 'bloqueio') return '🚫 ' + (ev.place || 'Compromisso pessoal');
  if (isEnsaio(ev)) return (ev.extra ? '⭐ Ensaio extra · ' : '🎼 Ensaio · ') + (ev.ownerType === 'grupo' ? ownerName(st, ev) : 'Solo');
  return ownerName(st, ev);
}
function ownerName(st, ev) {
  if (ev.ownerType === 'grupo') return st.grupos[ev.ownerId]?.name || 'Grupo removido';
  if (ev.kind === 'bloqueio') return 'Compromisso pessoal';
  return 'Solo';
}
function ownerColor(st, ev) {
  if (ev.kind === 'bloqueio') return BLOCK_COLOR;
  if (ev.ownerType === 'grupo') return st.grupos[ev.ownerId]?.color || '#3b82f6';
  return SOLO_COLOR;
}
function cantorName(st, login) { return st.cantores[login]?.name || login; }
// Como a pessoa gosta de ser chamada (apelido); se não preencheu, o primeiro nome.
const callName = (st, login) => (st.cantores[login]?.apelido || '').trim() || (cantorName(st, login) || '').split(' ')[0];
const allEvents = (st) => Object.values(st.eventos).filter(e => e.date && e.status !== 'recusado');
const eventsOn = (st, date) => allEvents(st).filter(e => e.date === date);

// Compromissos de uma pessoa (solo, bloqueios e todos os grupos dela).
function eventsOfPerson(st, login) {
  return allEvents(st).filter(e => participantsOf(st, e).includes(login));
}
// Pedido de igreja ainda não confirmado pelo grupo: aparece em amarelo pro próprio grupo,
// mas NÃO bloqueia os outros grupos dos integrantes até alguém confirmar.
const isChurchPending = (ev) => ev.source === 'igreja' && ev.status === 'pendente';

// Conflitos de uma lista de pessoas numa data/período (ignorando um compromisso específico).
function conflictsFor(st, logins, date, period, ignoreId) {
  const out = [];
  eventsOn(st, date).forEach(e => {
    if (e.id === ignoreId || !overlap(e.period, period)) return;
    const parts = participantsOf(st, e);
    logins.forEach(l => { if (parts.includes(l)) out.push({ login:l, ev:e }); });
  });
  return out;
}
// Situação de um grupo num dia: compromisso do próprio grupo e integrantes ocupados em outra coisa.
function groupDay(st, g, date) {
  const evs = eventsOn(st, date);
  const isOwn = (e) => g.__solo ? (e.ownerType === 'solo' && e.ownerId === g.id) : (e.ownerType === 'grupo' && e.ownerId === g.id);
  const own = evs.filter(isOwn);
  const busy = [];
  evs.forEach(e => {
    if (isOwn(e) || isChurchPending(e)) return;
    const parts = participantsOf(st, e);
    (g.members||[]).forEach(m => { if (parts.includes(m)) busy.push({ login:m, ev:e }); });
  });
  return { own, busy };
}
// Situação pública (página das igrejas): só "livre / a confirmar / indisponível", sem detalhes.
// Página das igrejas: qualquer compromisso já marcado (confirmado OU só pedido, aguardando)
// do grupo/cantor ou de qualquer integrante deixa aquele período "Indisponível".
function publicDay(st, g, date, period) {
  const members = g.members || [];
  const taken = eventsOn(st, date).some(e => (!period || overlap(e.period, period)) && participantsOf(st, e).some(m => members.includes(m)));
  return taken ? 'busy' : 'free';
}
function describeEv(st, ev) {
  const p = PER[ev.period] || PER.dia;
  return `${isEnsaio(ev) ? 'Ensaio · ' : ''}${ownerName(st, ev)} · ${p.label}${ev.time ? ' ' + ev.time : ''}${ev.place ? ' · ' + ev.place : ''}`;
}

// Avisos: quando alguém de um grupo meu marca outra coisa (solo, outro grupo ou bloqueio),
// o meu grupo fica indisponível nesse dia — e eu fico sabendo. Também avisa quando outro
// integrante marca uma apresentação pro meu grupo.
function buildAvisos(st, login) {
  if (!login) return [];
  const today = todayStr();
  const groups = myGroups(st, login);
  const out = [];
  allEvents(st).forEach(e => {
    if (e.date < today || e.status === 'recusado') return;
    const parts = participantsOf(st, e);
    // Observações de outras pessoas em compromissos de que eu participo.
    if (e.source === 'igreja' && e.ownerType === 'solo' && e.ownerId === login) {
      out.push({ id: e.id + '|solo', kind:'pedido', g: { name:'Solo', color: SOLO_COLOR }, ev:e, at:e.createdAt||0 });
    }
    if (parts.includes(login) || (e.ownerType === 'grupo' && st.grupos[e.ownerId]?.account === login)) {
      (e.obs || []).forEach((o, i) => {
        if (o.by !== login) out.push({ id: e.id + '|obs|' + i + '|' + o.at, kind:'obs', ev:e, obs:o, g: e.ownerType === 'grupo' ? st.grupos[e.ownerId] : null, at:o.at || 0 });
      });
    }
    groups.forEach(g => {
      if (e.ownerType === 'grupo' && e.ownerId === g.id) {
        if (e.source === 'igreja') out.push({ id:e.id+'|'+g.id, kind:'pedido', g, ev:e, at:e.createdAt||0 });
        else if (e.createdBy && e.createdBy !== login && !(e.seriesId && !e.seriesFirst && !e.extra)) out.push({ id:e.id+'|'+g.id, kind:'novo', g, ev:e, at:e.createdAt||0 });
        return;
      }
      if (isChurchPending(e)) return;
      const who = (g.members||[]).filter(m => m !== login && parts.includes(m));
      if (who.length) out.push({ id:e.id+'|'+g.id, kind:'bloqueio', g, ev:e, who, at:e.createdAt||0 });
    });
  });
  // Resposta do desenvolvedor às minhas sugestões.
  Object.values(st.log || {}).forEach(l => {
    if (l.type === 'sugestao' && l.login === login && l.reply) out.push({ id: 'sug|' + l.id + '|' + (l.replyAt || 0), kind:'resp', sug:l, g:{ color:'#10b981' }, at: l.replyAt || l.at || 0 });
  });
  return out.sort((a,b) => b.at - a.at);
}

// Foto/logo: reduz pra 320px e JPEG leve (~20-40 KB), pra caber no banco sem pesar o app.
function fileToLogo(file, max) {
  max = max || 320;
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function LoginScreen({ onLogin }) {
  const st = useStore();
  const [mode, setMode] = useState('login');
  const [who, setWho] = useState('');
  const [devUser, setDevUser] = useState('');
  const [pass, setPass] = useState('');
  const [remember, setRemember] = useState(true);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [forgot, setForgot] = useState(false);
  const [f, setF] = useState({ name:'', apelido:'', phone:'', login:'', pass:'', q:'', a:'' });
  const [acct, setAcct] = useState(() => { try { const v = localStorage.getItem('am_reg_group'); if (v) { localStorage.removeItem('am_reg_group'); return 'grupo'; } } catch(e) {} return 'cantor'; });
  const [gTipo, setGTipo] = useState('Quarteto');
  useEffect(() => { if (acct === 'grupo') setMode('register'); }, []);
  const up = (k) => (e) => setF(o => ({ ...o, [k]: e.target.value }));
  const cantores = useMemo(() => activeCantores(st).sort((a,b) => a.name.localeCompare(b.name,'pt-BR')), [st.cantores]);

  const doLogin = (e) => {
    e.preventDefault(); setErr('');
    const u = normLogin(who);
    if (!u) { setErr('Digite seu usuário.'); return; }
    if (u === DEV.login) {
      if (pass === DEV.password) { onLogin({ dev:true }, remember); return; }
      setErr('Usuário ou senha incorretos.'); return;
    }
    // Aceita o usuário ou o nome completo digitado.
    const c = st.cantores[u] || Object.values(st.cantores).find(x => !x.removed && normLogin(x.name) === u);
    if (!c || c.removed || c.passHash !== simpleHash(pass)) { setErr('Usuário ou senha incorretos.'); return; }
    if (c.paused) { setErr('Seu acesso está pausado. Fale com o Paulo.'); return; }
    Store.log('login', c.name);
    onLogin(c.isGroup ? { login: c.id, group: c.groupId } : { login: c.id }, remember);
  };

  const doRegister = async (e) => {
    e.preventDefault(); setErr('');
    const login = normLogin(f.login || f.name);
    if (!f.name.trim()) return setErr(acct === 'grupo' ? 'Digite o nome do grupo.' : 'Digite seu nome.');
    if (!login || login.length < 3) return setErr('Escolha um usuário com pelo menos 3 letras.');
    if (login === DEV.login) return setErr('Esse usuário é reservado. Escolha outro.');
    if (f.pass.length < 4) return setErr('A senha precisa ter pelo menos 4 caracteres.');
    if (!f.q.trim() || !f.a.trim()) return setErr('Preencha a pergunta e a resposta de segurança (servem pra recuperar a senha).');
    setBusy(true);
    const gid = acct === 'grupo' ? uid('gr') : null;
    const r = await Store.createCantor(login, {
      name: f.name.trim(), apelido: acct === 'grupo' ? '' : f.apelido.trim(), phone: f.phone.trim(), login,
      passHash: simpleHash(f.pass), q: f.q.trim(), aHash: simpleHash(f.a.trim().toLowerCase()),
      createdAt: Date.now(), removed:false, paused:false,
      ...(gid ? { isGroup:true, groupId: gid } : {})
    });
    if (r.taken) { setBusy(false); return setErr('Esse usuário já existe. Escolha outro.'); }
    if (r.error) { setBusy(false); return setErr('Não consegui criar a conta agora. Tente de novo em instantes; se continuar, fale com o Paulo.'); }
    if (gid) {
      await Store.set('grupos', gid, { name: f.name.trim(), tipo: gTipo, color: CORES[activeGrupos(st).length % CORES.length], logo:'', members:[], leader:null, account: login, phone: f.phone.trim(), createdBy: login, createdAt: Date.now(), removed:false });
      Store.log('grupo', f.name.trim(), 'criou a conta do grupo');
    } else Store.log('cadastro', f.name.trim());
    setBusy(false);
    onLogin(gid ? { login, group: gid } : { login }, true);
  };

  return html`
    <div style=${{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'20px'}}>
      <div class="fade-up" style=${{width:'100%', maxWidth:'430px'}}>
        <${Brand} />
        <div class="glass card" style=${{borderRadius:'22px', padding:'20px', display:'grid', gap:'14px'}}>
          <div class="seg">
            <button class=${mode==='login'?'on':''} onClick=${() => { setMode('login'); setErr(''); }}>Entrar</button>
            <button class=${mode==='register'?'on':''} onClick=${() => { setMode('register'); setErr(''); }}>Criar conta</button>
          </div>
          ${err && html`<div class="err">${err}</div>`}
          ${mode === 'login' ? html`
            <form onSubmit=${doLogin} style=${{display:'grid', gap:'10px'}}>
              <input class="inp" placeholder="Seu usuário" autocapitalize="off" autocomplete="username" value=${who} onInput=${e => setWho(e.target.value)} />
              <${PasswordInput} value=${pass} onChange=${setPass} />
              <label class="row muted" style=${{gap:'8px'}}>
                <input type="checkbox" checked=${remember} onChange=${e => setRemember(e.target.checked)} style=${{width:'18px', height:'18px'}} />
                Manter conectado neste aparelho
              </label>
              <button class="btn" type="submit">Entrar</button>
              <button class="link" type="button" onClick=${() => setForgot(true)}>Esqueci minha senha</button>
              <div class="dim" style=${{textAlign:'center'}}>Ainda não tem conta? Toque em <b>Criar conta</b>. O desenvolvedor entra com o usuário dele.</div>
            </form>
          ` : html`
            <form onSubmit=${doRegister} style=${{display:'grid', gap:'10px'}}>
              <div class="seg">
                <button type="button" class=${acct==='cantor'?'on':''} onClick=${() => setAcct('cantor')}>🎙️ Sou cantor(a)</button>
                <button type="button" class=${acct==='grupo'?'on':''} onClick=${() => setAcct('grupo')}>🎤 Conta de grupo</button>
              </div>
              ${acct === 'grupo' && html`<div class="dim">Primeiro crie a conta do grupo. Depois, dentro dela, você adiciona os integrantes (cada um com a conta de cantor dele).</div>`}
              <div class="lbl">${acct === 'grupo' ? 'Dados do grupo' : 'Seus dados'}</div>
              <input class="inp" placeholder=${acct === 'grupo' ? 'Nome do grupo' : 'Nome (como os grupos te conhecem)'} value=${f.name} onInput=${up('name')} autoFocus />
              ${acct !== 'grupo' && html`<input class="inp" placeholder="Como você gostaria de ser chamado(a)?" value=${f.apelido} onInput=${up('apelido')} />`}
              ${acct === 'grupo' && html`<div class="chips" style=${{flexWrap:'wrap'}}>${TIPOS.map(t => html`<button type="button" key=${t} class=${'chip ' + (gTipo===t?'on':'')} onClick=${() => setGTipo(t)}>${t}</button>`)}</div>`}
              <input class="inp" placeholder=${acct === 'grupo' ? 'WhatsApp do responsável (com DDD)' : 'WhatsApp (com DDD)'} inputmode="tel" value=${f.phone} onInput=${up('phone')} />
              <div class="lbl">Acesso</div>
              <input class="inp" placeholder=${'Usuário' + (f.name ? ' (ex: ' + normLogin(f.name) + ')' : '')} value=${f.login} onInput=${up('login')} autocapitalize="off" />
              <${PasswordInput} value=${f.pass} onChange=${v => setF(o => ({ ...o, pass:v }))} placeholder="Senha (mínimo 4)" />
              <div class="lbl">Pra recuperar a senha</div>
              <input class="inp" placeholder="Pergunta (ex: nome da minha primeira igreja)" value=${f.q} onInput=${up('q')} />
              <input class="inp" placeholder="Resposta" value=${f.a} onInput=${up('a')} />
              <button class="btn" type="submit" disabled=${busy}>${busy ? 'Criando…' : acct === 'grupo' ? 'Criar conta do grupo' : 'Criar minha conta'}</button>
            </form>
          `}
        </div>
        <div class="dim" style=${{textAlign:'center', marginTop:'14px'}}>v${APP_VERSION}</div>
      </div>
      ${forgot && html`<${ForgotSheet} onClose=${() => setForgot(false)} preset=${who} />`}
    </div>`;
}

function ForgotSheet({ onClose, preset }) {
  const st = useStore();
  const [who, setWho] = useState(preset || '');
  const [a, setA] = useState('');
  const [np, setNp] = useState('');
  const [err, setErr] = useState('');
  const [ok, setOk] = useState(false);
  const u = normLogin(who);
  const c = (st.cantores[u] && !st.cantores[u].removed) ? st.cantores[u] : null;
  const go = async () => {
    setErr('');
    if (!c) return setErr('Usuário não encontrado.');
    if (simpleHash(a.trim().toLowerCase()) !== c.aHash) return setErr('Resposta não confere.');
    if (np.length < 4) return setErr('A nova senha precisa ter pelo menos 4 caracteres.');
    await Store.update('cantores', c.id, { passHash: simpleHash(np) });
    Store.log('senha', c.name, 'recuperou a senha');
    setOk(true);
  };
  return html`<${Sheet} title="Recuperar senha" onClose=${onClose}>
    ${ok ? html`<div class="okbox">Senha trocada! Agora é só entrar com a nova senha.</div>
      <button class="btn" style=${{marginTop:'12px'}} onClick=${onClose}>Voltar pro login</button>` : html`
    <div style=${{display:'grid', gap:'10px'}}>
      ${err && html`<div class="err">${err}</div>`}
      <input class="inp" placeholder="Seu usuário" autocapitalize="off" value=${who} onInput=${e => setWho(e.target.value)} />
      ${who.trim() && !c && html`<div class="dim">Digite o usuário exatamente como cadastrou.</div>`}
      ${c && html`
        <div class="muted"><b>Pergunta:</b> ${c.q}</div>
        <input class="inp" placeholder="Sua resposta" value=${a} onInput=${e => setA(e.target.value)} />
        <${PasswordInput} value=${np} onChange=${setNp} placeholder="Nova senha" />
        <button class="btn" onClick=${go}>Trocar senha</button>`}
      <div class="dim">Não lembra a resposta? Fale com o Paulo — ele troca pelo Painel do Desenvolvedor.</div>
    </div>`}
  </${Sheet}>`;
}

// ---------- CALENDÁRIO ----------
function Calendar({ month, setMonth, renderDay, onPick }) {
  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const days = []; for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
  const today = todayStr();
  const lastRowUsed = days.slice(35).some(d => d.getMonth() === month.getMonth());
  const shown = lastRowUsed ? days : days.slice(0, 35);
  const shift = (n) => setMonth(new Date(month.getFullYear(), month.getMonth() + n, 1));
  return html`
    <div class="calbox">
      <div class="cal-head">
        <button onClick=${() => shift(-1)}>‹</button>
        <button class="mtitle" onClick=${() => setMonth(new Date(new Date().getFullYear(), new Date().getMonth(), 1))} style=${{width:'auto', border:'none', background:'none', fontWeight:900, fontSize:'17px', padding:'0 6px'}}>${MESES[month.getMonth()]} ${month.getFullYear()}</button>
        <button onClick=${() => shift(1)}>›</button>
      </div>
      <div class="cal">
        ${DOW.map((d,i) => html`<div class="dow" key=${'w'+i}>${d}</div>`)}
        ${shown.map(d => {
          const s = ymd(d);
          const info = renderDay(s) || {};
          const cls = ['day', d.getMonth() !== month.getMonth() ? 'out' : '', s < today ? 'past' : '', s === today ? 'today' : '', info.cls || ''].join(' ');
          return html`<button key=${s} class=${cls} onClick=${() => onPick(s)}>
            <span>${d.getDate()}</span>
            ${info.mark ? html`<span style=${{fontSize:'11px', lineHeight:1}}>${info.mark}</span>` : null}
            ${info.dots && info.dots.length ? html`<div class="dots">${info.dots.slice(0,4).map((c,i) => html`<span key=${i} class="dot" style=${{background:c}}></span>`)}</div>` : null}
          </button>`;
        })}
      </div>
    </div>`;
}

// Contexto da agenda: { type:'pessoa', login } ou { type:'grupo', id }
function contextLabel(st, ctx, me) {
  if (ctx.type === 'grupo') return st.grupos[ctx.id]?.name || 'Grupo';
  if (ctx.login === me) return 'Minha agenda';
  return cantorName(st, ctx.login);
}

function AgendaView({ me, ctx, setCtx, readOnly, showChips }) {
  const st = useStore();
  const [month, setMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [day, setDay] = useState(null);
  const [form, setForm] = useState(() => { const d = readDraft(); const typed = d && ((d.repert || []).length || (d.focus || '').trim() || (d.place || '').trim() || (d.notes || '').trim() || (d.manual || []).length);
    return d && typed && d.me === me && !d.editId ? { ctx, date: d.date, ensaio: d.tipo === 'ensaio', bloqueio: !!d.bloqueio } : null; });
  const groups = me ? myGroups(st, me) : [];
  const g = ctx.type === 'grupo' ? st.grupos[ctx.id] : null;
  const today = todayStr();

  const personEvents = useMemo(() => ctx.type === 'pessoa' ? eventsOfPerson(st, ctx.login) : [], [st, ctx.type, ctx.login]);
  const byDate = useMemo(() => { const m = {}; personEvents.forEach(e => { (m[e.date] = m[e.date] || []).push(e); }); return m; }, [personEvents]);

  const renderDay = (s) => {
    if (ctx.type === 'pessoa') {
      const evs = byDate[s] || [];
      return { dots: evs.map(e => ownerColor(st, e)), cls: evs.length ? 'st-has' : (s >= today ? 'st-open' : '') };
    }
    if (!g) return {};
    const { own, busy } = groupDay(st, g, s);
    if (own.length) return { cls: own.every(e => e.status === 'pendente') ? 'st-maybe' : 'st-mine', dots: busy.length ? ['#ef4444'] : [] };
    if (busy.length) return { cls:'st-busy' };
    return { cls: s >= today ? 'st-free' : '' };
  };

  const upcoming = useMemo(() => {
    const list = ctx.type === 'pessoa' ? personEvents : allEvents(st).filter(e => e.ownerType === 'grupo' && e.ownerId === ctx.id);
    return list.filter(e => e.date >= today).sort((a,b) => (a.date + (a.time||'')).localeCompare(b.date + (b.time||''))).slice(0, 8);
  }, [st, ctx, personEvents]);

  const busyUpcoming = useMemo(() => {
    if (!g) return [];
    const seen = {}; const out = [];
    allEvents(st).filter(e => e.date >= today).forEach(e => {
      if (e.ownerType === 'grupo' && e.ownerId === g.id) return;
      const parts = participantsOf(st, e);
      const who = (g.members||[]).filter(m => parts.includes(m));
      if (who.length) out.push({ e, who });
    });
    return out.sort((a,b) => a.e.date.localeCompare(b.e.date)).slice(0, 8);
  }, [st, g]);

  const canEditCtx = !readOnly && me && (ctx.type === 'pessoa' ? ctx.login === me : canManage(st, g, me));

  return html`
    <div class="fade-up" style=${{display:'grid', gap:'12px'}}>
      ${showChips && ctx.type === 'pessoa' && ctx.login === me && html`<${AgendaBanner} me=${me} onPick=${setDay} />`}
      ${g && !readOnly && html`<${AgendaBanner} me=${me} gid=${g.id} onPick=${setDay} />`}
      ${showChips && groups.length > 0 && html`<div class="chips">
        <button class=${'chip ' + (ctx.type==='pessoa' ? 'on' : '')} style=${ctx.type==='pessoa' ? {background:'linear-gradient(135deg,var(--accent-1),var(--accent-2))'} : null} onClick=${() => setCtx({ type:'pessoa', login:me })}>👤 Minha agenda</button>
        ${groups.map(x => html`<button key=${x.id} class=${'chip ' + (ctx.type==='grupo' && ctx.id===x.id ? 'on' : '')} style=${ctx.type==='grupo' && ctx.id===x.id ? {background:x.color} : {borderColor:x.color+'88'}} onClick=${() => setCtx({ type:'grupo', id:x.id })}>🎤 ${x.name}</button>`)}
      </div>`}

      ${readOnly && html`<div class="glass card">
        ${g && html`<div class="row" style=${{marginBottom:'10px'}}>
          <div class="sq" style=${{background:g.color, width:'14px', height:'14px'}}></div>
          <div style=${{fontWeight:800}}>${g.name}</div>
          <div class="dim">· ${g.tipo} · ${(g.members||[]).length} integrante${(g.members||[]).length===1?'':'s'}</div>
        </div>`}
        ${!g && ctx.type === 'pessoa' && ctx.login !== me && html`<div class="row" style=${{marginBottom:'10px'}}>
          <${Avatar} name=${cantorName(st, ctx.login)} size=${28} />
          <div style=${{fontWeight:800}}>${cantorName(st, ctx.login)}</div>
        </div>`}
        <${Calendar} month=${month} setMonth=${setMonth} renderDay=${renderDay} onPick=${setDay} />
        ${ctx.type === 'grupo' ? html`<div class="legend">
          <span><i class="sq" style=${{background:'rgba(16,185,129,.5)'}}></i>Livre</span>
          <span><i class="sq" style=${{background:'var(--mine)'}}></i>Agendado</span>
          <span><i class="sq" style=${{background:'var(--maybe)'}}></i>A confirmar</span>
          <span><i class="sq" style=${{background:'var(--busy)'}}></i>Indisponível</span>
        </div>` : html`<div class="legend">
          <span><i class="dot" style=${{background:SOLO_COLOR}}></i>Solo</span>
          ${myGroups(st, ctx.login).map(x => html`<span key=${x.id}><i class="dot" style=${{background:x.color}}></i>${x.name}</span>`)}
          <span><i class="dot" style=${{background:BLOCK_COLOR}}></i>Pessoal</span>
        </div>`}
      </div>`}

      ${canEditCtx && html`<div class="actions-row">
        <button class="btn" style=${{flex:'1 1 100%'}} onClick=${() => setForm({ date: today >= ymd(month) ? today : ymd(month), ctx })}>➕ Agendar apresentação</button>
        <button class="btn2" style=${{flex:'1 1 120px'}} onClick=${() => setForm({ date: today >= ymd(month) ? today : ymd(month), ctx, ensaio:true })}>🎼 Ensaio</button>
        ${ctx.type === 'pessoa' && html`<button class="btn2" style=${{flex:'1 1 120px'}} onClick=${() => setForm({ date: today, ctx, bloqueio:true })}>🚫 Bloquear dia</button>`}
      </div>`}
      ${me && html`<button class="btn2" style=${{background:'rgba(16,185,129,.18)', borderColor:'rgba(16,185,129,.45)'}} onClick=${() => shareAgenda(st, ctx, me)}>📤 Compartilhar agenda (imagem)</button>`}

      ${readOnly && html`<div>
        <div class="lbl" style=${{marginBottom:'8px'}}>Próximos compromissos</div>
        ${upcoming.length ? html`<div class="list">${upcoming.map(e => html`<${EventRow} key=${e.id} ev=${e} onClick=${() => setDay(e.date)} />`)}</div>`
          : html`<div class="dim">Nada agendado ainda.</div>`}
      </div>`}

      ${readOnly && g && busyUpcoming.length > 0 && html`<div>
        <div class="lbl" style=${{marginBottom:'8px'}}>Datas indisponíveis (integrante ocupado)</div>
        <div class="list">${busyUpcoming.map(({e, who}) => html`<button key=${e.id} class="item" onClick=${() => setDay(e.date)}>
          <div style=${{fontSize:'20px'}}>🔴</div>
          <div style=${{flex:1}}>
            <div style=${{fontWeight:700}}>${fmtDateLong(e.date)} · ${PER[e.period]?.label}</div>
            <div class="dim">${who.map(w => cantorName(st, w)).join(', ')} — ${canSeeEv(st, e, me) ? ownerName(st, e) : 'outro compromisso'}</div>
          </div>
        </button>`)}</div>
      </div>`}

      ${day && html`<${DaySheet} me=${me} ctx=${ctx} date=${day} readOnly=${!canEditCtx} onClose=${() => setDay(null)}
          onNew=${(o) => { setDay(null); setForm({ date: day, ctx, ...o }); }}
          onEdit=${(ev) => { setDay(null); setForm({ ev, ctx }); }} />`}
      ${form && html`<${EventForm} me=${me} init=${form} onClose=${() => setForm(null)} />`}
    </div>`;
}

// ---------- COMPARTILHAR A AGENDA MONTADA (imagem) ----------
function loadImg(src) { return new Promise((res) => { if (!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
async function shareAgenda(st, ctx, me) {
  const today = todayStr();
  let title, sub, color, logo, list;
  if (ctx.type === 'grupo') {
    const g = st.grupos[ctx.id]; if (!g) return;
    title = g.name; sub = (g.tipo || 'Grupo') + ' · Agenda de apresentações';
    color = g.color || '#8b5cf6'; logo = g.logo;
    list = allEvents(st).filter(e => e.ownerType === 'grupo' && e.ownerId === g.id && e.date >= today && e.status !== 'pendente' && !isEnsaio(e));
  } else {
    const c = st.cantores[me] || {};
    title = c.name || 'Minha agenda'; sub = 'Agenda de apresentações'; color = SOLO_COLOR; logo = c.photo;
    list = eventsOfPerson(st, me).filter(e => e.date >= today && e.kind !== 'bloqueio' && !isEnsaio(e) && e.status !== 'pendente');
  }
  list.sort((a,b) => (a.date + (a.time||'')).localeCompare(b.date + (b.time||'')));
  list = list.slice(0, 10);
  if (!list.length) { toast('Ainda não há apresentações confirmadas pra compartilhar.'); return; }

  const W = 1080, rowH = 118, top = 330, H = top + list.length * rowH + 150;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const bg = x.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#0b1120'); bg.addColorStop(1, '#1e1035');
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  const glow = x.createRadialGradient(W, 0, 50, W, 0, 700); glow.addColorStop(0, color + '88'); glow.addColorStop(1, 'transparent');
  x.fillStyle = glow; x.fillRect(0, 0, W, H);
  const rr = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
  // cabeçalho
  const img = await loadImg(logo);
  x.save(); x.beginPath(); x.arc(150, 160, 90, 0, Math.PI * 2); x.closePath(); x.clip();
  if (img) { const k = Math.max(180 / img.width, 180 / img.height); x.drawImage(img, 150 - img.width * k / 2, 160 - img.height * k / 2, img.width * k, img.height * k); }
  else { x.fillStyle = color; x.fillRect(60, 70, 180, 180); x.fillStyle = '#fff'; x.font = 'bold 72px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(initials(title), 150, 165); }
  x.restore();
  x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.fillStyle = '#ffffff'; x.font = 'bold 58px sans-serif'; x.fillText(title.length > 26 ? title.slice(0, 25) + '…' : title, 280, 150);
  x.fillStyle = '#cbd5e1'; x.font = '32px sans-serif'; x.fillText(sub.length > 48 ? sub.slice(0, 47) + '…' : sub, 280, 200);
  x.fillStyle = color; x.font = 'bold 30px sans-serif'; x.fillText('🎶 PRÓXIMAS APRESENTAÇÕES', 60, 300);
  // linhas
  list.forEach((e, i) => {
    const y = top + i * rowH, d = parseYmd(e.date), p = PER[e.period] || PER.dia;

    x.fillStyle = color; rr(50, y, 12, rowH - 18, 6); x.fill();
    x.fillStyle = '#fff'; x.font = 'bold 54px sans-serif'; x.textAlign = 'center'; x.fillText(String(d.getDate()), 150, y + 62);
    x.fillStyle = '#94a3b8'; x.font = 'bold 22px sans-serif'; x.fillText(MESES[d.getMonth()].slice(0, 3).toUpperCase() + ' · ' + DOW_LONG[d.getDay()].slice(0, 3).toUpperCase(), 150, y + 90);

    const line1 = (e.place || 'Local a definir') ; const line2 = p.label + (e.time ? ' · ' + e.time : '') + (who ? ' · ' + who : '');
    x.fillStyle = '#fff'; x.font = 'bold 36px sans-serif'; x.fillText(line1.length > 36 ? line1.slice(0, 35) + '…' : line1, 240, y + 52);
    x.fillStyle = '#cbd5e1'; x.font = '28px sans-serif'; x.fillText(line2.length > 48 ? line2.slice(0, 47) + '…' : line2, 240, y + 88);
  });
  x.fillStyle = '#64748b'; x.font = '26px sans-serif'; x.textAlign = 'center';
  x.fillText('Agenda Musical · atualizada em ' + fmtDate(today), W / 2, H - 60);

  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const file = new File([blob], 'agenda-' + normLogin(title) + '.png', { type: 'image/png' });
  const text = '🎶 Agenda — ' + title + '\n' + list.map(e => '• ' + fmtDate(e.date) + ' ' + (PER[e.period]||PER.dia).label + (e.place ? ' — ' + e.place : '')).join('\n');
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Agenda — ' + title, text }); return; }

  // Computador: baixa a imagem e abre o WhatsApp com o texto da agenda.
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  toast('Imagem da agenda baixada 📥');
  setTimeout(() => window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank'), 600);
}

      <div style=${{fontWeight:900, color:'#fcd34d'}}>🟡 A confirmar</div>

        <div style=${{minWidth:'44px', textAlign:'center'}}><div style=${{fontSize:'11px', fontWeight:900, color:'#fcd34d'}}>${DOW3[d.getDay()].toUpperCase()}</div><div style=${{fontWeight:900, fontSize:'17px', lineHeight:1.1}}>${d.getDate()}/${pad(d.getMonth()+1)}</div></div>

          <span style=${{width:'8px', height:'8px', borderRadius:'50%', background: ownerColor(st, e), boxShadow:'0 0 8px ' + ownerColor(st, e), flex:'none'}}></span>

    ${next.map(e => { const d = parseYmd(e.date); return html`<button key=${e.id} onClick=${() => onPick(e.date)} style=${{display:'flex', gap:'10px', alignItems:'center', textAlign:'left', padding:'9px 10px', borderRadius:'12px', border:'none', background:'rgba(2,6,23,.35)', color:'var(--text-hi)'}}>

// Aviso de versão nova: confere a cada 3 min (e quando o app volta pra frente) se o
// arquivo publicado tem outro número de versão. Se tiver, mostra a faixa "Atualizar".
function UpdateBanner() {
  const [nv, setNv] = useState(null);
  useEffect(() => {
    let stop = false;
    const check = async () => {
      try {
        const r = await fetch(location.pathname + '?vcheck=' + Date.now(), { cache:'no-store' });
        const t = await r.text();
        const m = t.match(/APP_VERSION = '([^']+)'/);
        if (!stop && m && m[1] !== APP_VERSION) setNv(m[1]);
      } catch(e) {}
    };
    check();
    const iv = setInterval(check, 3 * 60 * 1000);
    const vis = () => { if (document.visibilityState === 'visible') check(); };
    document.addEventListener('visibilitychange', vis);
    return () => { stop = true; clearInterval(iv); document.removeEventListener('visibilitychange', vis); };
  }, []);
  if (!nv) return null;
  const go = async () => {
    try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch(e) {}
    location.reload();
  };
  return html`<div style=${{position:'relative', margin:'10px auto', maxWidth:'520px', zIndex:5, padding:'10px 12px', borderRadius:'14px', background:'linear-gradient(135deg,#ec4899,#8b5cf6)', color:'#fff', boxShadow:'0 12px 30px -10px #000', display:'flex', alignItems:'center', gap:'10px'}}>
    <div style=${{flex:1, fontWeight:800, fontSize:'14px'}}>🆕 Nova versão do app disponível</div>
    <button onClick=${go} style=${{border:'none', borderRadius:'10px', padding:'8px 12px', fontWeight:800, background:'#fff', color:'#7c3aed'}}>Atualizar</button>
  </div>`;
}

// Observações dentro de cada apresentação (tipo um chat curto entre os integrantes).
function ObsThread({ ev, me, canWrite }) {
  const st = useStore();
  const [txt, setTxt] = useState('');
  const list = (ev.obs || []).slice().sort((a,b) => (a.at||0) - (b.at||0));
  const fmtAt = (t) => { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const send = async () => {
    const t = txt.trim(); if (!t) return;
    setTxt('');
    await Store.addObs(ev.id, { by: me, text: t, at: Date.now() });
    toast('Observação enviada 💬');
  };
  if (!list.length && !canWrite) return null;
  return html`<div style=${{marginTop:'10px', borderTop:'1px solid var(--border-soft)', paddingTop:'8px', display:'grid', gap:'6px'}}>

    ${canWrite && html`<div class="row" style=${{gap:'6px'}}>
      <input class="inp" style=${{padding:'9px 11px', fontSize:'14px'}} placeholder="Escrever observação…" value=${txt} onInput=${e => setTxt(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') send(); }} />
      <button class="btn2" style=${{whiteSpace:'nowrap'}} disabled=${!txt.trim()} onClick=${send}>Enviar</button>
    </div>`}

}

function DaySheet({ me, ctx, date, readOnly, onClose, onNew, onEdit }) {
  const st = useStore();
  const g = ctx.type === 'grupo' ? st.grupos[ctx.id] : null;
  let own = [], busy = [];
  if (g) { const r = groupDay(st, g, date); own = r.own; busy = r.busy; }
  else own = eventsOn(st, date).filter(e => participantsOf(st, e).includes(ctx.login));

  const canTouch = (ev) => !readOnly && me && (ev.ownerType === 'grupo' ? canManage(st, st.grupos[ev.ownerId], me) : ev.ownerId === me);
  const del = async (ev) => {
    if (!confirm('Excluir esse compromisso? A data volta a ficar livre pros grupos.')) return;
    if (ev.seriesId) {
      const next = Object.values(st.eventos).filter(e => e.seriesId === ev.seriesId && e.id !== ev.id && e.date > ev.date);
      if (next.length && confirm('Excluir também os próximos ' + next.length + ' ensaio(s) desta série?\n\nOK = excluir todos os próximos · Cancelar = só este')) {
        for (const e of next) await Store.remove('eventos', e.id);
      }
    }
    await Store.remove('eventos', ev.id);
    Store.log('exclusao', cantorName(st, me), ownerName(st, ev) + ' ' + fmtDate(ev.date));
    toast('Compromisso excluído');
  };
  const confirmEv = async (ev) => {
    if (isChurchPending(ev)) {
      const g2 = st.grupos[ev.ownerId];
      const c = conflictsFor(st, (g2?.members || []), ev.date, ev.period, ev.id);
      if (c.length) { alert('Não dá pra confirmar: ' + [...new Set(c.map(x => x.login === me ? 'você' : cantorName(st, x.login)))].join(', ') + ' já tem compromisso nesse dia e período. Recuse o pedido ou combine outra data com a igreja.'); return; }
    }
    await Store.update('eventos', ev.id, { status:'confirmado', confirmedBy: me, confirmedAt: Date.now() });
    Store.log('confirmacao', cantorName(st, me), ownerName(st, ev) + ' ' + fmtDate(ev.date));
    toast('Confirmado ✅');
  };
  const refuseEv = async (ev) => {
    if (!confirm('Recusar o pedido de ' + (ev.church?.name || 'igreja') + '? A data volta a aparecer livre pras igrejas.')) return;
    await Store.update('eventos', ev.id, { status:'recusado', refusedBy: me, refusedAt: Date.now() });
    Store.log('recusa', cantorName(st, me), (ev.church?.name || 'igreja') + ' ' + fmtDate(ev.date));
    toast('Pedido recusado');
  };

  return html`<${Sheet} title=${fmtDateLong(date)} onClose=${onClose}>
    <div style=${{display:'grid', gap:'10px'}}>
      ${own.length === 0 && busy.length === 0 && html`<div class="okbox">${g ? '🟢 Data livre — todos os integrantes estão disponíveis.' : '🟢 Nenhum compromisso nesse dia.'}</div>`}
      ${own.map(ev => {
        const p = PER[ev.period] || PER.dia;
        const parts = participantsOf(st, ev);
        return html`<div key=${ev.id} class="ev" style=${{borderLeftColor: ownerColor(st, ev)}}>
          <div style=${{fontWeight:800, fontSize:'15.5px'}}>${evTitle(st, ev)}</div>
          <div class="muted" style=${{marginTop:'3px'}}>${p.ic} ${p.label}${ev.time ? ' · ' + ev.time : ''}</div>
          ${ev.kind !== 'bloqueio' && ev.place && html`<div class="muted">📍 ${ev.place}</div>`}
          ${(ev.parts || []).length > 0 && html`<div class="chips" style=${{flexWrap:'wrap', marginTop:'4px'}}>${ev.parts.map(p => html`<span key=${p} class="chip on" style=${{cursor:'default'}}>${p}</span>`)}</div>`}
          ${isEnsaio(ev) && ev.focus && html`<div class="muted">🎯 <b>Foco:</b> ${ev.focus}</div>`}
          ${isEnsaio(ev) && html`<${RepertoireView} rep=${ev.repertoire} me=${me} />`}
          ${isEnsaio(ev) && ev.seriesId && html`<div class="dim">🔁 Ensaio recorrente</div>`}
          ${ev.notes && html`<div class="muted">📝 ${ev.notes}</div>`}
          ${ev.source === 'igreja' && ev.church && html`<${ChurchInfo} ev=${ev} />`}
          ${ev.ownerType === 'grupo' && html`<div class="dim" style=${{marginTop:'4px'}}>👥 ${parts.map(l => cantorName(st, l)).join(', ')}${(ev.excluded||[]).length ? ' · substituído(s): ' + ev.excluded.map(l => cantorName(st, l)).join(', ') : ''}</div>`}
          <div class="row" style=${{marginTop:'6px', flexWrap:'wrap', gap:'6px'}}>
            ${ev.status === 'pendente' ? html`<span class="sync" style=${{background:'rgba(245,158,11,.15)', color:'#fcd34d'}}>🟡 A confirmar</span>` : isEnsaio(ev) ? html`<span class="sync" style=${{background:'rgba(16,185,129,.15)', color:'#6ee7b7'}}>🎼 Ensaio</span>` : ev.kind !== 'bloqueio' ? html`<span class="sync" style=${{background:'rgba(59,130,246,.18)', color:'#93c5fd'}}>🔵 Confirmado</span>` : null}
            <span class="dim">${ev.source === 'igreja' ? '⛪ pedido feito pela igreja' : 'marcado por ' + cantorName(st, ev.createdBy)}</span>
          </div>
          ${canTouch(ev) && html`<div class="row" style=${{marginTop:'10px', gap:'6px'}}>
            ${ev.status === 'pendente' && html`<button class="btn2 btn-green" style=${{flex:1}} onClick=${() => confirmEv(ev)}>✅ Confirmar</button>`}
            ${isChurchPending(ev) ? html`<button class="btn2 btn-red" style=${{flex:1}} onClick=${() => refuseEv(ev)}>✖️ Recusar</button>` : html`
              <button class="btn2" style=${{flex:1}} onClick=${() => onEdit(ev)}>✏️ Editar</button>
              <button class="btn2 btn-red" style=${{flex:1}} onClick=${() => del(ev)}>🗑️ Excluir</button>`}
          </div>`}
          ${ev.kind !== 'bloqueio' && html`<${ObsThread} ev=${ev} me=${me} canWrite=${!!me && (parts.includes(me) || canTouch(ev))} />`}
        </div>`;

// ---------- ENSAIOS INDEFINIDOS: estende sozinho ----------
// Séries "♾️ Indefinido" ficam sempre com ~1 ano marcado à frente. Roda quando alguém do grupo
// (ou o dono do solo) abre o app. Os ids são fixos (série + data), então dois aparelhos rodando
// ao mesmo tempo não duplicam nada.
async function extendOpenSeries(st, me) {
  const today = todayStr();
  const t = parseYmd(today);
  const limit = ymd(new Date(t.getFullYear(), t.getMonth(), t.getDate() + 364));
  const refill = ymd(new Date(t.getFullYear(), t.getMonth(), t.getDate() + 300));
  const bySeries = {};
  Object.values(st.eventos).forEach(e => { if (e.seriesId && e.seriesOpen && e.status !== 'recusado') (bySeries[e.seriesId] = bySeries[e.seriesId] || []).push(e); });
  let made = 0;
  for (const sid of Object.keys(bySeries)) {
    const list = bySeries[sid].sort((a,b) => a.date.localeCompare(b.date));
    const last = list[list.length - 1];
    if (last.date >= refill) continue;
    const mine = last.ownerType === 'grupo' ? canManage(st, st.grupos[last.ownerId], me) : last.ownerId === me;
    if (!mine) continue;
    const who = last.ownerType === 'grupo' ? (st.grupos[last.ownerId]?.members || []) : [last.ownerId];
    const every = last.seriesFreq === 'quinzenal' ? 2 : 1;
    const ld = parseYmd(last.date);
    const startSun = new Date(ld.getFullYear(), ld.getMonth(), ld.getDate() - ld.getDay() + 7 * every);
    const dates = weekDates(ymd(startSun), last.seriesDias || [ld.getDay()], 60, every).filter(d => d > last.date && d <= limit);
    for (const d of dates) {
      if (conflictsFor(st, who, d, last.period).length) continue;
      const id = sid + '-' + d;
      if (st.eventos[id]) continue;
      const { obs, ...rest } = last;
      await Store.set('eventos', id, { ...rest, id, date: d, seriesFirst:false, extra:false, createdAt: Date.now() });
      made++;
    }
  }
  return made;
}

const KIT_VOZES = ['Soprano','Contralto','Tenor','Baixo','Playback','Completa'];
const ytSearchUrl = (q) => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
function ytId(url) {
  const u = (url || '').trim();
  if (/^[\w-]{11}$/.test(u)) return u;
  const m = u.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function ytSuggest(query, cb) {
  try {
    const name = '__ytS_' + Math.random().toString(36).slice(2);
    let done = false; const sc = document.createElement('script');
    const fin = (l) => { if (done) return; done = true; cb(l); try { delete window[name]; } catch(e) {} sc.remove(); };
    window[name] = (d) => { let l = []; try { l = (d && d[1] ? d[1] : []).map(x => Array.isArray(x) ? x[0] : x).filter(Boolean); } catch(e) {} fin(l); };
    sc.src = 'https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q=' + encodeURIComponent(query) + '&callback=' + name;
    sc.onerror = () => fin([]); document.body.appendChild(sc); setTimeout(() => fin([]), 4000);
  } catch(e) { cb([]); }
}
// Aceita o formato antigo (lista de textos) e o novo ({ title, focus, kits:[{voz, videoId}] }).
const normRep = (r) => (r || []).map(x => typeof x === 'string' ? { title:x, focus:false, kits:[] } : { title: x.title || '', focus: !!x.focus, kits: x.kits || [] }).filter(x => x.title);

function RepertoireEditor({ value, onChange }) {
  const [pick, setPick] = useState(null); // { i, voz }
  const list = value;
  const upd = (i, patch) => onChange(list.map((x, k) => k === i ? { ...x, ...patch } : x));
  const move = (i, d) => { const j = i + d; if (j < 0 || j >= list.length) return; const n = list.slice(); [n[i], n[j]] = [n[j], n[i]]; onChange(n); };
  const toggleVoz = (i, voz) => {
    const s = list[i]; const has = s.kits.find(k => k.voz === voz);
    if (has && has.videoId) { setPick({ i, voz }); return; }
    if (has) upd(i, { kits: s.kits.filter(k => k.voz !== voz) });
    else { upd(i, { kits: [...s.kits, { voz, videoId:null }] }); setPick({ i, voz }); }
  };
  return html`<div style=${{display:'grid', gap:'8px'}}>
    <${SongSearch} onAdd=${(t) => onChange([...list, { title:t, focus:false, kits:[] }])} />

        <button class="chip" onClick=${() => move(i, -1)}>↑</button>
        <button class="chip" onClick=${() => onChange(list.filter((_, k) => k !== i))}>✕</button>
      </div>
      <div class="dim">Kits:</div>
      <div class="chips" style=${{flexWrap:'wrap'}}>${KIT_VOZES.map(v => { const k = s.kits.find(x => x.voz === v); return html`<button key=${v} class=${'chip ' + (k ? 'on' : '')} style=${k && k.videoId ? {background:'#16a34a'} : k ? {background:'#b45309'} : null} onClick=${() => toggleVoz(i, v)}>${k && k.videoId ? '✅' : k ? '🔎' : '＋'} ${v}</button>`; })}</div>
    </div>`)}
    ${pick && list[pick.i] && html`<${KitPicker} song=${list[pick.i].title} voz=${pick.voz} kit=${list[pick.i].kits.find(k => k.voz === pick.voz)}

      onSave=${(k) => { const s = list[pick.i]; const rest = s.kits.filter(x => x.voz !== pick.voz); upd(pick.i, { kits: k ? [...rest, k].sort((a,b) => KIT_VOZES.indexOf(a.voz) - KIT_VOZES.indexOf(b.voz)) : rest }); setPick(null); }} />`}
  </div>`;
}

function EventForm({ me, init, onClose }) {
  const st = useStore();
  const editing = init.ev || null;
  const isBlock = editing ? editing.kind === 'bloqueio' : !!init.bloqueio;
  const groups = myGroups(st, me);
  const defOwner = editing ? (editing.ownerType === 'grupo' ? editing.ownerId : 'solo') : (init.ctx?.type === 'grupo' ? init.ctx.id : (groups[0]?.id || 'solo'));
  const [dr] = useState(() => {
    const d = readDraft();
    const typed = d && ((d.repert || []).length || (d.focus || '').trim() || (d.place || '').trim() || (d.notes || '').trim() || (d.manual || []).length);
    const sameKind = d && (editing ? true : (!!init.ensaio === (d.tipo === 'ensaio')));
    return d && typed && sameKind && d.me === me && (d.editId || null) === (editing?.id || null) && !!d.bloqueio === isBlock ? d : null;
  });
  const pickD = (k, def) => dr && dr[k] !== undefined ? dr[k] : def;
  const [owner, setOwner] = useState(pickD('owner', defOwner));
  const [date, setDate] = useState(pickD('date', editing?.date || init.date || todayStr()));
  const [period, setPeriod] = useState(pickD('period', editing?.period || 'noite'));
  const [time, setTime] = useState(pickD('time', editing?.time || ''));
  const [place, setPlace] = useState(pickD('place', editing?.place || ''));
  const [notes, setNotes] = useState(pickD('notes', editing?.notes || ''));
  const [status, setStatus] = useState(pickD('status', editing?.status || 'confirmado'));
  const [parts, setParts] = useState(pickD('parts', editing?.parts || []));
  const [tipo, setTipo] = useState(pickD('tipo', editing ? (editing.kind === 'ensaio' ? 'ensaio' : 'apresentacao') : (init.ensaio ? 'ensaio' : 'apresentacao')));
  const ens = !isBlock && tipo === 'ensaio';
  const [focus, setFocus] = useState(pickD('focus', editing?.focus || ''));
  const [repert, setRepert] = useState(pickD('repert', normRep(editing?.repertoire)));
  const [freq, setFreq] = useState(pickD('freq', 'nao'));
  const [count, setCount] = useState(pickD('count', 8));
  const [dias, setDias] = useState(pickD('dias', []));
  const [semFim, setSemFim] = useState(pickD('semFim', false));
  const [manual, setManual] = useState(pickD('manual', []));   // dias extras marcados no calendário
  const [removed, setRemoved] = useState(pickD('removed', [])); // dias da recorrência tirados no calendário
  const [extra, setExtra] = useState(pickD('extra', editing?.extra || false));
  const [calM, setCalM] = useState(() => { const d = parseYmd(editing?.date || init.date || todayStr()); return new Date(d.getFullYear(), d.getMonth(), 1); });
  useEffect(() => { if (dr) toast('📝 Rascunho recuperado — continue de onde parou'); }, []);
  useEffect(() => {
    writeDraft({ me, editId: editing?.id || null, bloqueio: isBlock, owner, date, period, time, place, notes, status, tipo, focus, repert, freq, count, dias, semFim, manual, removed, extra, parts });
  }, [owner, date, period, time, place, notes, status, tipo, focus, repert, freq, count, dias, semFim, manual, removed, extra, parts]);
  const closeForm = () => { clearDraft(); onClose(); };
  const [applyNext, setApplyNext] = useState(false);
  const [ask, setAsk] = useState(null);
  const [err, setErr] = useState('');

  const g = owner !== 'solo' ? st.grupos[owner] : null;
  const who = isBlock || !g ? [me] : (g.members||[]);
  const conflicts = conflictsFor(st, who, date, period, editing?.id);
  // Datas do ensaio: recorrência (menos os dias tirados) + dias extras marcados no calendário.
  const baseDates = ens && !editing && date ? (freq !== 'nao' && dias.length ? weekDates(date, dias, semFim ? (freq === 'quinzenal' ? 26 : 52) : Math.max(1, Math.min(52, Number(count) || 1)), freq === 'quinzenal' ? 2 : 1) : [date]) : [];
  const selDates = [...new Set([...baseDates.filter(d => !removed.includes(d)), ...manual])].sort();
  const busyOn = (d) => conflictsFor(st, who, d, period).length > 0;
  const tapCal = (d) => {
    if (d < todayStr()) return toast('Esse dia já passou');
    if (baseDates.includes(d)) { setRemoved(removed.includes(d) ? removed.filter(x => x !== d) : [...removed, d]); return; }
    if (manual.includes(d)) { setManual(manual.filter(x => x !== d)); return; }
    if (busyOn(d)) return toast('⛔ Dia ocupado nesse período');
    setManual([...manual, d]);
  };
  const calInfo = (d) => {
    if (manual.includes(d)) return { cls:'st-extra', mark:'⭐' };
    if (baseDates.includes(d)) return removed.includes(d) ? { cls:'st-off' } : busyOn(d) ? { cls:'st-busy', mark:'⛔' } : { cls:'st-ens', mark:'🎼' };
    const evs = eventsOn(st, d).filter(e => overlap(e.period, period) && participantsOf(st, e).some(l => who.includes(l)));
    return evs.length ? { cls:'st-busy', dots: evs.map(e => ownerColor(st, e)) } : null;
  };

  // Outros grupos que vão ficar indisponíveis por causa desse compromisso (pra mostrar o aviso).
  const affected = useMemo(() => {
    const out = [];
    activeGrupos(st).forEach(x => {
      if (x.id === owner) return;
      const hit = (x.members||[]).filter(m => who.includes(m));
      if (hit.length) out.push({ g:x, hit });
    });
    return out;
  }, [st, owner, who.join(',')]);

  const save = async (excluded) => {
    setErr('');
    if (!date) return setErr('Escolha a data.');
    if (ens && !editing && freq !== 'nao' && !dias.length) return setErr('Escolha em quais dias da semana são os ensaios.');
    // Trava final: com os substitutos já descontados, ninguém pode ficar com dois compromissos no mesmo período.
    const still = conflictsFor(st, who.filter(l => !(excluded || []).includes(l)), date, period, editing?.id);
    if (still.length) { setAsk(null); return setErr('Essa data e período já estão ocupados. Escolha outra data ou outro período.'); }
    const base = editing || { id: uid('ev'), createdBy: me, createdAt: Date.now() };
    const ev = {
      ...base,
      kind: isBlock ? 'bloqueio' : 'apresentacao',
      ownerType: isBlock ? 'pessoal' : (g ? 'grupo' : 'solo'),
      ownerId: isBlock || !g ? me : g.id,
      date, period, time: time || '', place: place.trim(), notes: notes.trim(), parts: (!isBlock && tipo !== 'ensaio') ? parts : [],
      status: isBlock ? 'confirmado' : status,
      excluded: excluded || (editing && g ? (editing.excluded||[]) : []),
    };
    if (ens) {
      ev.kind = 'ensaio'; ev.status = 'confirmado';
      ev.focus = focus.trim();
      ev.repertoire = repert;
    }
    // Ensaio recorrente: cria um compromisso por data, pulando as que já estão ocupadas.
    if (ens) ev.extra = !!extra;
    if (ens && !editing && (selDates.length > 1 || manual.length)) {
      const seriesId = uid('ser'); const skipped = []; let made = 0;
      for (const d of selDates) {
        if (conflictsFor(st, who, d, period).length) { skipped.push(fmtDate(d)); continue; }
        const one = { ...ev, id: made === 0 ? ev.id : uid('ev'), date: d, seriesId, seriesFirst: made === 0, seriesFreq: freq, seriesDias: dias, seriesOpen: semFim && freq !== 'nao', extra: manual.includes(d) || (!!extra && selDates.length === 1) };
        await Store.set('eventos', one.id, one); made++;
      }
      Store.log('agendamento', cantorName(st, me), 'Ensaios ' + (g ? g.name : 'Solo') + ' (' + made + 'x a partir de ' + fmtDate(date) + ')');
      toast('🎼 ' + made + ' ensaio(s) marcados' + (skipped.length ? ' · pulados (data ocupada): ' + skipped.join(', ') : ''));
      closeForm(); return;
    }
    const ok = await Store.set('eventos', ev.id, ev);
    if (ens && editing && editing.seriesId && applyNext) {
      const next = Object.values(st.eventos).filter(e => e.seriesId === editing.seriesId && e.id !== editing.id && e.date > editing.date);
      for (const e of next) await Store.update('eventos', e.id, { focus: ev.focus, repertoire: ev.repertoire, place: ev.place, time: ev.time, notes: ev.notes });
    }
    Store.log(editing ? 'edicao' : 'agendamento', cantorName(st, me), (isBlock ? 'Bloqueio' : (ens ? 'Ensaio ' : '') + (g ? g.name : 'Solo')) + ' ' + fmtDate(date));
    toast(ok ? (affected.length ? `Salvo! ${affected.length} grupo(s) avisado(s) 🔔` : 'Salvo na agenda ✅') : 'Salvo no aparelho — vai pra nuvem quando a internet voltar');
    closeForm();
  };
  const trySave = () => { if (conflicts.length) setAsk(true); else save(); };
  const blocked = conflicts.length > 0;
  const conflictLogins = [...new Set(conflicts.map(c => c.login))];

  return html`<${Sheet} title=${editing ? 'Editar compromisso' : isBlock ? 'Bloquear dia' : ens ? 'Novo ensaio' : 'Nova apresentação'} onClose=${() => { if (ens && (repert.length || focus.trim()) && !confirm('Fechar sem salvar? O rascunho fica guardado e volta quando você abrir de novo.\n\nOK = fechar · Cancelar = continuar editando')) return; if (!(ens && (repert.length || focus.trim()))) clearDraft(); onClose(); }}>
    <div style=${{display:'grid', gap:'10px'}}>
      ${err && html`<div class="err">${err}</div>`}
      ${!isBlock && !editing && html`<div class="seg">
        <button class=${tipo==='apresentacao'?'on':''} onClick=${() => setTipo('apresentacao')}>🎤 Apresentação</button>
        <button class=${tipo==='ensaio'?'on':''} onClick=${() => setTipo('ensaio')}>🎼 Ensaio</button>
      </div>`}
      ${!isBlock && html`<div>
        <div class="lbl" style=${{marginBottom:'8px'}}>${ens ? 'Ensaio de quem?' : 'Quem vai cantar?'}</div>
        <div class="chips" style=${{flexWrap:'wrap'}}>
          ${!isGroupAcct(st, me) && html`<button class=${'chip ' + (owner==='solo'?'on':'')} style=${owner==='solo' ? {background:SOLO_COLOR} : null} onClick=${() => setOwner('solo')}>🎙️ Eu (solo)</button>`}
          ${groups.map(x => html`<button key=${x.id} class=${'chip ' + (owner===x.id?'on':'')} style=${owner===x.id ? {background:x.color} : {borderColor:x.color+'88'}} onClick=${() => setOwner(x.id)}>🎤 ${x.name}</button>`)}
        </div>
      </div>`}
      <div class="lbl">${ens && !editing && freq !== 'nao' ? 'A partir de' : 'Quando'}</div>
      <input class="inp" type="date" value=${date} onInput=${e => { setDate(e.target.value); if (e.target.value) { const d = parseYmd(e.target.value); setCalM(new Date(d.getFullYear(), d.getMonth(), 1)); } }} />
      ${!(ens && !editing) && html`<div>
        <div class="dim" style=${{marginBottom:'6px'}}>Toque no dia no calendário (vermelho = ocupado nesse período):</div>
        <${Calendar} month=${calM} setMonth=${setCalM} renderDay=${(d) => d === date ? { cls:'st-ens', mark:'✔' } : (conflictsFor(st, who, d, period, editing?.id).length ? { cls:'st-busy' } : (d >= todayStr() ? { cls:'st-free' } : null))} onPick=${(d) => { if (d < todayStr()) return toast('Esse dia já passou'); setDate(d); }} />
      </div>`}
      <div class="seg">${PERIODOS.map(p => html`<button key=${p.id} class=${period===p.id?'on':''} onClick=${() => setPeriod(p.id)}>${p.ic} ${p.label}</button>`)}</div>
      ${!isBlock && html`<input class="inp" type="time" value=${time} onInput=${e => setTime(e.target.value)} />`}
      ${ens && !editing && html`<div style=${{display:'grid', gap:'8px', padding:'10px', borderRadius:'12px', border:'1px solid rgba(16,185,129,.35)', background:'rgba(16,185,129,.08)'}}>
        <div class="lbl">🔁 Ensaios toda semana</div>
        <div class="seg">
          <button class=${freq==='nao'?'on':''} onClick=${() => setFreq('nao')}>Só este dia</button>
          <button class=${freq==='semanal'?'on':''} onClick=${() => setFreq('semanal')}>Toda semana</button>
          <button class=${freq==='quinzenal'?'on':''} onClick=${() => setFreq('quinzenal')}>A cada 2 sem.</button>
        </div>
        ${freq !== 'nao' && html`
          <div class="muted">Em quais dias da semana? <b>${dias.length} ensaio${dias.length === 1 ? '' : 's'} por semana</b></div>
          <div class="chips" style=${{flexWrap:'wrap'}}>${DOW3.map((lb, i) => html`<button key=${i} class=${'chip ' + (dias.includes(i) ? 'on' : '')} style=${dias.includes(i) ? {background:'#10b981'} : null} onClick=${() => setDias(dias.includes(i) ? dias.filter(x => x !== i) : [...dias, i])}>${lb}</button>`)}</div>
          <div class="row" style=${{gap:'8px', alignItems:'center'}}>
            <span class="muted">Por quantas semanas?</span>
            ${!semFim && html`<input class="inp" type="number" min="1" max="52" style=${{width:'90px'}} value=${count} onInput=${e => setCount(e.target.value === '' ? '' : String(Math.max(1, Math.min(52, Number(e.target.value) || 1))))} />`}
            <button class=${'chip ' + (semFim ? 'on' : '')} style=${semFim ? {background:'linear-gradient(135deg,#8b5cf6,#06b6d4)'} : null} onClick=${() => setSemFim(!semFim)}>♾️ Indefinido</button>
          </div>
          ${semFim ? html`<div class="dim">♾️ Repete sem data pra acabar: o app marca 1 ano à frente e vai estendendo sozinho. Pra parar, exclua um ensaio e escolha “excluir também os próximos”.</div>` : html`<div class="dim">(máx. 52 semanas = 1 ano)</div>`}
          ${!dias.length && html`<div class="err">Escolha pelo menos um dia da semana.</div>`}
        `}
        <div class="lbl" style=${{marginTop:'4px'}}>📅 Calendário dos ensaios</div>
        <div class="dim">Toque num dia pra marcar um <b style=${{color:'#fbbf24'}}>⭐ ensaio extra</b>. Toque num 🎼 pra tirar aquele dia.</div>
        <${Calendar} month=${calM} setMonth=${setCalM} renderDay=${calInfo} onPick=${tapCal} />
        <div class="legend">
          <span><i class="sq" style=${{background:'#10b981'}}></i>Ensaio</span>
          <span><i class="sq" style=${{background:'#f59e0b'}}></i>Extra</span>
          <span><i class="sq" style=${{background:'rgba(239,68,68,.6)'}}></i>Ocupado</span>
        </div>
        <div class="okbox" style=${{padding:'8px 10px'}}>🎼 ${selDates.length} ensaio(s)${manual.length ? ' · ⭐ ' + manual.length + ' extra(s)' : ''}${selDates.length ? ': ' + selDates.slice(0, 8).map(fmtDate).join(', ') + (selDates.length > 8 ? '…' : '') : ''}</div>
      </div>`}
      ${ens && (editing || selDates.length <= 1) && html`<label class="row" style=${{gap:'8px', alignItems:'center'}}><input type="checkbox" checked=${extra} onChange=${e => setExtra(e.target.checked)} /> <span class="muted">⭐ Ensaio extra (excepcional)</span></label>`}

      ${conflicts.length ? html`<div class="err">
        <b>⛔ Data ocupada nesse período — não dá pra agendar:</b>
        ${conflicts.map((c,i) => html`<div key=${i}>• ${c.login === me ? 'Você' : cantorName(st, c.login)} — ${privateDesc(st, c.ev, me)}</div>`)}
      </div>` : date ? html`<div class="okbox">✅ ${g && !isBlock ? 'Todos os integrantes estão livres' : 'Você está livre'} nesse período.</div>` : null}

      <div class="lbl">${isBlock ? 'Motivo (só você vê o detalhe)' : 'Onde'}</div>
      <input class="inp" placeholder=${isBlock ? 'Ex: viagem, trabalho…' : 'Igreja / local'} value=${place} onInput=${e => setPlace(e.target.value)} />
      ${ens && html`<div class="lbl">🎯 Foco do ensaio</div>
      <input class="inp" placeholder="Ex: afinação das vozes, entrada do refrão…" value=${focus} onInput=${e => setFocus(e.target.value)} />
      <div class="lbl">🎵 Repertório e kits de cada música</div>
      <${RepertoireEditor} value=${repert} onChange=${setRepert} />`}
      ${ens && editing && editing.seriesId && html`<label class="row" style=${{gap:'8px', alignItems:'center'}}><input type="checkbox" checked=${applyNext} onChange=${e => setApplyNext(e.target.checked)} /> <span class="muted">Aplicar foco, repertório, local e horário aos próximos ensaios da série</span></label>`}
      ${!isBlock && !ens && html`<div class="lbl">Tipo de participação</div><${PartChips} value=${parts} onChange=${setParts} />`}
      ${!isBlock && html`<textarea class="inp" rows="2" placeholder="Observação (contato, detalhes…)" value=${notes} onInput=${e => setNotes(e.target.value)}></textarea>`}
      ${!isBlock && !ens && html`<div class="seg">
        <button class=${status==='confirmado'?'on':''} onClick=${() => setStatus('confirmado')}>🔵 Confirmado</button>
        <button class=${status==='pendente'?'on':''} onClick=${() => setStatus('pendente')}>🟡 A confirmar</button>
      </div>`}

      ${affected.length > 0 && html`<div class="dim">🔔 Essa data vai ficar <b style=${{color:'#fca5a5'}}>indisponível</b> automaticamente em: ${affected.map(a => a.g.name).join(', ')}.</div>`}

      <button class="btn" style=${blocked ? {background:'#475569'} : null} onClick=${trySave}>${blocked ? '⛔ Data ocupada — ver opções' : editing ? 'Salvar alterações' : isBlock ? 'Bloquear dia' : ens ? (selDates.length > 1 ? '🎼 Marcar ' + selDates.length + ' ensaios' : 'Marcar ensaio') : 'Agendar'}</button>
    </div>
    ${ask && html`<${Sheet} title="⛔ Data ocupada" onClose=${() => setAsk(null)}>
      <div style=${{display:'grid', gap:'10px'}}>
        <div class="warnbox">${conflictLogins.map(l => l === me ? 'Você' : cantorName(st, l)).join(', ')} já ${conflictLogins.length > 1 ? 'têm' : 'tem'} compromisso nesse período.</div>
        <div class="dim">Ninguém pode ter dois compromissos no mesmo dia e período.</div>
        <button class="btn2" onClick=${() => setAsk(null)}>📅 Escolher outra data ou período</button>
        ${g && !isBlock && conflictLogins.length < (g.members||[]).length && html`<button class="btn2" onClick=${() => save(conflictLogins)}>🔁 Agendar com substituto (sem ${conflictLogins.map(l => cantorName(st, l)).join(', ')})</button>`}
      </div>
    </${Sheet}>`}
  </${Sheet}>`;
}

function GroupForm({ me, g, onClose }) {
  const st = useStore();
  const [name, setName] = useState(g?.name || '');
  const [tipo, setTipo] = useState(g?.tipo || 'Quarteto');
  const [color, setColor] = useState(g?.color || CORES[activeGrupos(st).length % CORES.length]);
  const [logo, setLogo] = useState(g?.logo || '');

  const save = async () => {
    if (!name.trim()) return setErr('Dê um nome pro grupo.');
    if (g) { await Store.update('grupos', g.id, { name: name.trim(), tipo, color, logo }); toast('Grupo atualizado'); }
    else {
      const id = uid('gr');
      await Store.set('grupos', id, { name: name.trim(), tipo, color, logo, members:[me], leader: me, createdBy: me, createdAt: Date.now(), removed:false });
      Store.log('grupo', cantorName(st, me), 'criou ' + name.trim());
      toast('Grupo criado! Agora adicione os integrantes 🎤');
    }
    onClose();
  };
  return html`<${Sheet} title=${g ? 'Editar grupo' : 'Novo grupo'} onClose=${onClose}>
    <div style=${{display:'grid', gap:'10px'}}>
      ${err && html`<div class="err">${err}</div>`}

      <div class="lbl">Tipo</div>
      <div class="chips" style=${{flexWrap:'wrap'}}>${TIPOS.map(t => html`<button key=${t} class=${'chip ' + (tipo===t?'on':'')} style=${tipo===t ? {background:'linear-gradient(135deg,var(--accent-1),var(--accent-2))'} : null} onClick=${() => setTipo(t)}>${t}</button>`)}</div>
      <div class="lbl">Foto ou logo do grupo</div>
      <${PhotoPicker} value=${logo} onChange=${setLogo} label="logo" name=${name || 'Grupo'} color=${color} />
      <div class="lbl">Cor na agenda</div>
      <div class="row" style=${{flexWrap:'wrap', gap:'8px'}}>${CORES.map(c => html`<button key=${c} onClick=${() => setColor(c)} style=${{width:'36px', height:'36px', borderRadius:'50%', background:c, border: color===c ? '3px solid #fff' : '3px solid transparent'}}></button>`)}</div>
      <button class="btn" onClick=${save}>${g ? 'Salvar' : 'Criar grupo'}</button>
    </div>
  </${Sheet}>`;
}

  const members = (g.members||[]);
  const ql = q.trim().toLowerCase();
  const candidates = ql.length < 2 ? [] : activeCantores(st).filter(c => !members.includes(c.id) && (c.name.toLowerCase().includes(ql) || c.id.includes(normLogin(ql)))).sort((a,b) => a.name.localeCompare(b.name,'pt-BR')).slice(0, 15);
  const add = async (login) => { await Store.update('grupos', g.id, { members: [...members, login] }); toast(cantorName(st, login) + ' entrou no grupo'); Store.log('integrante', cantorName(st, me), cantorName(st, login) + ' → ' + g.name); };

        <div class="row" style=${{gap:'6px'}}>

          <button class="btn2" title="Copiar link" onClick=${copyLink}>🔗</button>
          <a class="btn2" title="Ver como a igreja vê" style=${{textDecoration:'none', textAlign:'center'}} href=${bookingLink(g.id)} target="_blank">👁️</a>

        <${Avatar} name=${cantorName(st, m)} />
        <div style=${{flex:1}}>
          <div style=${{fontWeight:700}}>${cantorName(st, m)}${m === me ? ' (você)' : ''}</div>
