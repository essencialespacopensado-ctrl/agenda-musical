// Funções de um integrante: marcar/desmarcar, criar funções novas e apagar as que o grupo não usa.
function FuncoesSheet({ g, login, onClose }) {
  const st = useStore();
  const [novo, setNovo] = useState(''); const [editLista, setEditLista] = useState(false);
  const lista = g.funcoesLista || FUNCOES;
  const cur = (g.funcoes || {})[login] || [];
  const all = [...lista, ...cur.filter(f => !lista.includes(f))];
  const toggle = (f) => Store.update('grupos', g.id, { funcoes: { ...(g.funcoes || {}), [login]: cur.includes(f) ? cur.filter(x => x !== f) : [...cur, f] } });
  const add = () => { const f = novo.trim(); if (!f) return; const l = lista.includes(f) ? lista : [...lista, f]; Store.update('grupos', g.id, { funcoesLista: l, funcoes: { ...(g.funcoes || {}), [login]: cur.includes(f) ? cur : [...cur, f] } }); setNovo(''); toast('Função “' + f + '” criada ✅'); };
  const remove = (f) => {
    if (!confirm('Apagar a função “' + f + '” do grupo? Ela sai de todos os integrantes.')) return;
    const fs = {}; Object.entries(g.funcoes || {}).forEach(([k, v]) => { fs[k] = (v || []).filter(x => x !== f); });
    Store.update('grupos', g.id, { funcoesLista: lista.filter(x => x !== f), funcoes: fs });
  };
  return html`<${Sheet} title=${'🎚️ Funções de ' + cantorName(st, login)} onClose=${onClose}>
    <div style=${{display:'grid', gap:'10px'}}>
      <div class="muted">${editLista ? 'Toque no ✕ pra apagar uma função da lista do grupo.' : 'Toque pra marcar ou desmarcar (pode mais de uma). Salva na hora.'}</div>
      <div class="chips" style=${{flexWrap:'wrap'}}>${all.map(f => { const on = cur.includes(f); return editLista
        ? html`<button key=${f} class="chip" style=${{borderColor:'rgba(239,68,68,.6)'}} onClick=${() => remove(f)}>✕ ${f}</button>`
        : html`<button key=${f} class=${'chip ' + (on ? 'on' : '')} style=${on ? {background:'linear-gradient(135deg,#10b981,#06b6d4)', color:'#fff'} : null} onClick=${() => toggle(f)}>${on ? '✅ ' : ''}${f}</button>`; })}</div>
      <div class="row" style=${{gap:'6px'}}>
        <input class="inp" placeholder="Nova função (ex.: Regente, Abertura)" value=${novo} onInput=${e => setNovo(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') add(); }} />
        <button class="btn2 btn-green" style=${{whiteSpace:'nowrap'}} onClick=${add}>➕ Criar</button>
      </div>
      <div class="row" style=${{gap:'6px'}}>
        <button class="btn2" style=${{flex:1}} onClick=${() => setEditLista(!editLista)}>${editLista ? '✔️ Terminar edição da lista' : '✏️ Editar lista de funções'}</button>
        ${g.funcoesLista && html`<button class="btn2" onClick=${() => { if (confirm('Voltar para a lista de funções original?')) Store.update('grupos', g.id, { funcoesLista: null }); }}>↺ Original</button>`}
      </div>
      <button class="btn" onClick=${onClose}>Pronto</button>
    </div>
  </${Sheet}>`;
}

// Cria o login de um grupo que já existia (feito antes da conta de grupo existir).
function GroupAcctForm({ g, me, onClose }) {
  const st = useStore();
  const [u, setU] = useState(normLogin(g.name)); const [pw, setPw] = useState(''); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const go = async () => {
    const login = normLogin(u);
    if (!login || login.length < 3) return setErr('Usuário com pelo menos 3 letras.');
    if (login === DEV.login) return setErr('Esse usuário é reservado.');
    if (pw.length < 4) return setErr('Senha com pelo menos 4 caracteres.');
    setBusy(true);
    const c = st.cantores[me] || {};
    const r = await Store.createCantor(login, { name: g.name, phone: c.phone || '', login, passHash: simpleHash(pw), q: c.q || '', aHash: c.aHash || '', isGroup:true, groupId: g.id, createdAt: Date.now(), removed:false, paused:false });
    setBusy(false);
    if (r.taken) return setErr('Esse usuário já existe. Escolha outro.');
    if (r.error) return setErr('Não consegui criar agora. Tente de novo.');
    await Store.update('grupos', g.id, { account: login });
    Store.log('grupo', cantorName(st, me), 'criou o login do grupo ' + g.name);
    toast('Login do grupo criado 🔑'); onClose();
  };
  return html`<${Sheet} title=${'🔑 Login do ' + g.name} onClose=${onClose}>
    <div style=${{display:'grid', gap:'10px'}}>
      ${err && html`<div class="err">${err}</div>`}

      <input class="inp" placeholder="Usuário do grupo" autocapitalize="off" value=${u} onInput=${e => setU(e.target.value)} />

}

// Conta de cantor que na verdade é de um grupo → vira conta de grupo.
// Os compromissos "solo" dela passam a ser do grupo, e o link antigo (?solo=) continua funcionando.
async function convertToGroup(st, me, tipo) {
  const c = st.cantores[me] || {};
  const gid = uid('gr');
  await Store.set('grupos', gid, { name: c.name || me, tipo: tipo || 'Grupo', color: CORES[activeGrupos(st).length % CORES.length], logo: c.photo || '', members: [], leader: null, account: me, phone: c.phone || '', cost: c.cost || null, createdBy: me, createdAt: Date.now(), removed:false });
  await Store.update('cantores', me, { isGroup: true, groupId: gid });
  for (const e of Object.values(st.eventos)) {
    if (e.ownerType === 'solo' && e.ownerId === me) await Store.update('eventos', e.id, { ownerType:'grupo', ownerId: gid });
  }
  for (const g of activeGrupos(st)) {
    if ((g.members || []).includes(me)) await Store.update('grupos', g.id, { members: g.members.filter(m => m !== me) });
  }
  Store.log('grupo', c.name || me, 'transformou a conta em conta de grupo');
  return gid;
}

// Página de custos do grupo: ponto de saída, valor por km, ida e volta, extras.
function CostForm({ g, me, onClose }) {
  const c = g.cost || {};
  const [origem, setOrigem] = useState(c.origem || '');
  const [valorKm, setValorKm] = useState(c.valorKm != null ? String(c.valorKm).replace('.', ',') : '');
  const [idaVolta, setIdaVolta] = useState(c.idaVolta !== false);
  const [extra, setExtra] = useState(c.extra ? String(c.extra).replace('.', ',') : '');
  const [extraLabel, setExtraLabel] = useState(c.extraLabel || '');
  const [minimo, setMinimo] = useState(c.minimo ? String(c.minimo).replace('.', ',') : '');
  const [obs, setObs] = useState(c.obs || '');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [test, setTest] = useState('');
  const [testRes, setTestRes] = useState(null);
  const cfg = { origem, valorKm: parseMoney(valorKm), idaVolta, extra: parseMoney(extra), minimo: parseMoney(minimo) };

  const save = async () => {
    setErr('');
    if (!origem.trim()) return setErr('Informe de onde o grupo sai (cidade ou endereço).');
    if (!cfg.valorKm) return setErr('Informe o valor por km (ex: 1,50).');
    setBusy(true);
    let geo = null;
    try { geo = await geocode(origem); } catch(e) { setBusy(false); return setErr('Não achei esse endereço no mapa. Tente "Rua, número, cidade - UF" ou só "Cidade - UF".'); }
    await Store.update(g.__solo ? 'cantores' : 'grupos', g.id, { cost: { origem: origem.trim(), lat: geo.lat, lon: geo.lon, valorKm: cfg.valorKm, idaVolta, extra: cfg.extra, extraLabel: extraLabel.trim(), minimo: cfg.minimo, obs: obs.trim(), updatedBy: me } });
    setBusy(false);
    toast('Custos salvos ✅');
    onClose();
  };
  const simulate = async () => {
    setTestRes(null); setErr('');
    if (!origem.trim() || !test.trim()) return;
    setTestRes({ loading:true });
    try { setTestRes(await quoteFor({ ...cfg, lat:null, lon:null }, test)); }
    catch(e) { setTestRes(null); setErr('Não consegui calcular essa rota. Confira os dois endereços.'); }
  };

  return html`<${Sheet} title=${'💰 Custos — ' + (g.__solo ? 'Solo' : g.name)} onClose=${onClose}>
    <div style=${{display:'grid', gap:'10px'}}>
      ${err && html`<div class="err">${err}</div>`}
      <div class="lbl">De onde o grupo sai</div>
      <input class="inp" placeholder="Ex: Rua X, 100, Camboriú - SC" value=${origem} onInput=${e => setOrigem(e.target.value)} />
      <div class="lbl">Valor por km</div>
      <input class="inp" inputmode="decimal" placeholder="Ex: 1,50" value=${valorKm} onInput=${e => setValorKm(e.target.value)} />
      <div class="seg">
        <button class=${idaVolta ? 'on' : ''} onClick=${() => setIdaVolta(true)}>↔️ Ida e volta</button>
        <button class=${!idaVolta ? 'on' : ''} onClick=${() => setIdaVolta(false)}>➡️ Só ida</button>
      </div>
      <div class="lbl">Extra fixo (opcional)</div>
      <div class="row" style=${{gap:'6px'}}>
        <input class="inp" placeholder="Pedágio, alimentação…" value=${extraLabel} onInput=${e => setExtraLabel(e.target.value)} />
        <input class="inp" style=${{maxWidth:'120px'}} inputmode="decimal" placeholder="R$ 0,00" value=${extra} onInput=${e => setExtra(e.target.value)} />
      </div>
      <div class="lbl">Valor mínimo (opcional)</div>
      <input class="inp" inputmode="decimal" placeholder="Ex: 50,00 (pra viagens curtas)" value=${minimo} onInput=${e => setMinimo(e.target.value)} />
      <textarea class="inp" rows="2" placeholder="Observação que a igreja vai ver (ex: valor combinado na hora, aceitamos Pix…)" value=${obs} onInput=${e => setObs(e.target.value)}></textarea>

      <div class="glass card" style=${{display:'grid', gap:'8px', padding:'12px'}}>
        <div style=${{fontWeight:800}}>🧮 Simular</div>
        <div class="row" style=${{gap:'6px'}}>
          <input class="inp" placeholder="Endereço de uma igreja pra testar" value=${test} onInput=${e => setTest(e.target.value)} />
          <button class="btn2" onClick=${simulate}>Calcular</button>
        </div>
        ${testRes?.loading && html`<div class="dim">Calculando a rota…</div>`}
        ${testRes && !testRes.loading && html`<div class="okbox">
          🚗 ${testRes.km.toFixed(1)} km (ida) · ${testRes.kmTotal.toFixed(1)} km no total · ~${Math.round(testRes.min)} min<br/>
          💰 <b>${brl(testRes.total)}</b> ${cfg.extra ? '(inclui ' + brl(cfg.extra) + ' de ' + (extraLabel || 'extra') + ')' : ''}
          <div style=${{marginTop:'6px'}}><a style=${{color:'#6ee7b7'}} href=${mapsLink(origem, test)} target="_blank">🗺️ Conferir rota no Google Maps</a></div>
        </div>`}
      </div>
      <button class="btn" disabled=${busy} onClick=${save}>${busy ? 'Salvando…' : 'Salvar custos'}</button>
    </div>
  </${Sheet}>`;
}

function AvisosView({ me, avisos, openDay }) {
  const st = useStore();
  const [seen] = useState(() => Number(localStorage.getItem(SEEN_KEY + me) || 0));
  useEffect(() => { try { localStorage.setItem(SEEN_KEY + me, String(Date.now())); } catch(e) {} }, []);
  return html`<div class="fade-up" style=${{display:'grid', gap:'10px'}}>
    ${avisos.length === 0 && html`<div class="glass card muted">Nenhum aviso ainda. Aqui aparecem os pedidos das igrejas, as observações dos integrantes e as datas que ficaram indisponíveis nos seus grupos. 🔔</div>`}
    ${avisos.map(a => { const [t1, t2] = avisoText(st, a); const color = a.kind === 'bloqueio' ? 'var(--busy)' : a.kind === 'pedido' ? 'var(--maybe)' : (a.g?.color || SOLO_COLOR); return html`<button key=${a.id} class="item" onClick=${() => openDay(a)} style=${{borderLeft:'5px solid ' + color, background: a.at > seen ? 'rgba(236,72,153,.08)' : undefined}}>
      <div style=${{flex:1, minWidth:0}}>
        <div style=${{fontWeight:800}}>${t1}</div>
        <div class="dim">${t2}</div>
        ${a.kind === 'pedido' && html`<div class="dim">${isChurchPending(a.ev) ? '🟡 Aguardando confirmação' : '🔵 Confirmado'}${a.ev.church?.cost ? ' · ' + brl(a.ev.church.cost) : ''}</div>`}
        ${a.kind === 'obs' && html`<div class="dim">em ${ownerName(st, a.ev)} · ${fmtDate(a.ev.date)}</div>`}
      </div>
      ${a.at > seen && html`<span class="dot" style=${{background:'var(--accent-1)', width:'9px', height:'9px'}}></span>`}
    </button>`; })}
  </div>`;
}

function NotifyCard() {
  const supported = 'Notification' in window;
  const [perm, setPerm] = useState(supported ? Notification.permission : 'unsupported');
  const ask = async () => {
    try { const p = await Notification.requestPermission(); setPerm(p); if (p === 'granted') notify('🔔 Notificações ativadas', 'Você vai ser avisado de pedidos de igrejas e observações novas.'); } catch(e) {}
  };
  return html`<div class="glass card" style=${{display:'grid', gap:'8px'}}>
    <div style=${{fontWeight:800}}>🔔 Notificações neste aparelho</div>
    ${perm === 'granted' ? html`<div class="okbox">Ativadas. Você recebe aviso de pedidos de igrejas, observações e datas bloqueadas enquanto o app estiver aberto ou minimizado.</div>`
      : perm === 'denied' ? html`<div class="warnbox">Bloqueadas no navegador. Para liberar: toque no cadeado ao lado do endereço → Notificações → Permitir.</div>`
      : perm === 'unsupported' ? html`<div class="dim">Este navegador não suporta notificações. No iPhone, instale o app na Tela de Início primeiro.</div>`
      : html`<button class="btn" onClick=${ask}>Ativar notificações</button>
             <div class="dim">Funciona com o app aberto ou minimizado. Com o app totalmente fechado o celular não apita — os avisos ficam esperando na aba 🔔 Avisos.</div>`}
  </div>`;
}

  const [apelido, setApelido] = useState(c.apelido || '');
  const [bio, setBio] = useState(c.bio || '');
  const [q, setQ] = useState(c.q || ''); const [a, setA] = useState('');
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

    if (name === (c.name||'') && phone === (c.phone||'') && city === (c.city||'') && bio === (c.bio||'') && apelido === (c.apelido||'')) return;

      <div class="lbl">Sua foto (aparece no seu link solo)</div>
      <${PhotoPicker} value=${c.photo || ''} onChange=${v => { Store.update('cantores', me, { photo: v }); toast(v ? 'Foto salva ✅' : 'Foto removida'); }} name=${name} />
      <div class="lbl">Nome</div>
      <input class="inp" value=${name} onInput=${e => setName(e.target.value)} />
      <div class="lbl">Como você gostaria de ser chamado(a)?</div>
      <input class="inp" placeholder=${'Ex: ' + ((name || '').split(' ')[0] || 'Paulinho')} value=${apelido} onInput=${e => setApelido(e.target.value)} />

      <input class="inp" placeholder="Ex: Timbó - SC" value=${city} onInput=${e => setCity(e.target.value)} />

      <div class="chips" style=${{flexWrap:'wrap'}}>${['Soprano','Contralto','Tenor','Barítono','Baixo','Instrumentista'].map(v => html`<button key=${v} class=${'chip ' + (vozes.includes(v) ? 'on' : '')} onClick=${() => toggleVoz(v)}>${vozes.includes(v) ? '✅ ' : ''}${v}</button>`)}</div>
      <div class="lbl">Sobre você</div>
      <textarea class="inp" rows="3" placeholder="Conte um pouco do seu ministério, igreja, experiência…" value=${bio} onInput=${e => setBio(e.target.value)}></textarea>
      <div class="dim">As mudanças salvam sozinhas.</div>
    </div>
    <div class="glass card" style=${{display:'grid', gap:'10px'}}>
      <div class="lbl">Trocar senha</div>
      <${PasswordInput} value=${np} onChange=${setNp} placeholder="Nova senha" />
      <button class="btn2" disabled=${np.length < 4} onClick=${async () => { await Store.update('cantores', me, { passHash: simpleHash(np) }); setNp(''); toast('Senha trocada ✅'); }}>Salvar nova senha</button>

      <input class="inp" placeholder="Pergunta" value=${q} onInput=${e => setQ(e.target.value)} />
      <input class="inp" placeholder="Nova resposta" value=${a} onInput=${e => setA(e.target.value)} />
      <button class="btn2" disabled=${!q.trim() || !a.trim()} onClick=${async () => { await Store.update('cantores', me, { q: q.trim(), aHash: simpleHash(a.trim().toLowerCase()) }); setA(''); toast('Pergunta de segurança salva ✅'); }}>Salvar pergunta e resposta</button>

    <div class="lbl" style=${{marginTop:'4px'}}>🎤 Seus grupos, link solo e convites</div>

      ${installPrompt ? html`<button class="btn" onClick=${() => installPrompt.prompt()}>Instalar Agenda Musical</button>`

        : html`<div class="muted">No Android: toque nos <b>3 pontinhos</b> do navegador → <b>Instalar app</b> (ou "Adicionar à tela inicial").</div>`}

// ---------- SUGESTÕES ----------
// Guardadas junto do histórico (coleção agenda_log, tipo "sugestao"), então não precisa mexer nas regras do banco.
const SUG_STATUS = { nova:['🆕 Nova','#f59e0b'], lida:['👀 Vista','#3b82f6'], feita:['✅ Feita','#10b981'], recusada:['✖️ Não vai entrar','#64748b'] };
const fmtAtFull = (t) => { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function SuggestionsView({ me }) {
  const st = useStore();
  const [txt, setTxt] = useState('');
  const mine = Object.values(st.log).filter(l => l.type === 'sugestao' && l.login === me).sort((a,b) => (b.at||0) - (a.at||0));
  const send = async () => {
    const t = txt.trim(); if (t.length < 3) return;
    await Store.set('log', uid('sug'), { type:'sugestao', login: me, who: cantorName(st, me), detail: t, at: Date.now(), status:'nova', reply:'' });
    setTxt(''); toast('Sugestão enviada! Obrigado 💡');
  };
  return html`<div class="fade-up" style=${{display:'grid', gap:'12px'}}>
    <div class="glass card" style=${{display:'grid', gap:'10px'}}>
      <div style=${{fontWeight:800, fontSize:'16px'}}>💡 Mande sua sugestão</div>
      <div class="muted">Ideia, melhoria ou algo que não funcionou? Escreva aqui que chega direto pro desenvolvedor.</div>
      <textarea class="inp" rows="4" placeholder="Ex: seria bom ter…" value=${txt} onInput=${e => setTxt(e.target.value)}></textarea>
      <button class="btn" disabled=${txt.trim().length < 3} onClick=${send}>Enviar sugestão</button>
    </div>
    ${mine.length > 0 && html`<div class="lbl">Suas sugestões</div>`}
    <div class="list">${mine.map(l => { const [lab, col] = SUG_STATUS[l.status || 'nova'] || SUG_STATUS.nova; return html`<div key=${l.id} class="item" style=${{display:'grid', gap:'6px', borderLeft:'5px solid ' + col}}>
      <div>${l.detail}</div>
      <div class="row" style=${{justifyContent:'space-between'}}><span class="dim">${fmtAtFull(l.at)}</span><span class="sync" style=${{background: col + '22', color: col}}>${lab}</span></div>
      ${l.reply && html`<div class="okbox" style=${{padding:'8px 10px'}}><b>Resposta:</b> ${l.reply}</div>`}
    </div>`; })}</div>
  </div>`;
}
function DevSuggestions() {
  const st = useStore();
  const [filtro, setFiltro] = useState('abertas');
  const [resp, setResp] = useState({});
  const all = Object.values(st.log).filter(l => l.type === 'sugestao').sort((a,b) => (b.at||0) - (a.at||0));
  const list = all.filter(l => filtro === 'todas' ? true : ['nova','lida'].includes(l.status || 'nova'));
  const setStatus = (l, status) => Store.update('log', l.id, { status });
  const reply = async (l) => { const r = (resp[l.id] || '').trim(); if (!r) return; await Store.update('log', l.id, { reply: r, replyAt: Date.now(), status: (l.status === 'nova' ? 'lida' : l.status) }); setResp(o => ({ ...o, [l.id]: '' })); toast('Resposta enviada'); };
  return html`<div style=${{display:'grid', gap:'10px'}}>
    <div class="seg">
      <button class=${filtro==='abertas'?'on':''} onClick=${() => setFiltro('abertas')}>Em aberto (${all.filter(l => ['nova','lida'].includes(l.status || 'nova')).length})</button>
      <button class=${filtro==='todas'?'on':''} onClick=${() => setFiltro('todas')}>Todas (${all.length})</button>
    </div>
    ${list.length === 0 && html`<div class="glass card muted">Nenhuma sugestão ${filtro === 'abertas' ? 'em aberto' : 'ainda'}.</div>`}
    ${list.map(l => { const [lab, col] = SUG_STATUS[l.status || 'nova'] || SUG_STATUS.nova; return html`<div key=${l.id} class="glass card" style=${{display:'grid', gap:'8px', borderLeft:'5px solid ' + col}}>
      <div class="row" style=${{justifyContent:'space-between'}}><b>${l.who || l.login}</b><span class="dim">${fmtAtFull(l.at)}</span></div>
      <div>${l.detail}</div>
      <div class="row" style=${{gap:'6px', flexWrap:'wrap'}}>${Object.entries(SUG_STATUS).map(([k, [t, c]]) => html`<button key=${k} class="chip" style=${(l.status || 'nova') === k ? {background: c, color:'#fff', borderColor:'transparent'} : null} onClick=${() => setStatus(l, k)}>${t}</button>`)}</div>
      ${l.reply && html`<div class="okbox" style=${{padding:'8px 10px'}}><b>Sua resposta:</b> ${l.reply}</div>`}
      <div class="row" style=${{gap:'6px'}}>
        <input class="inp" style=${{padding:'9px 11px', fontSize:'14px'}} placeholder="Responder pro cantor…" value=${resp[l.id] || ''} onInput=${e => setResp(o => ({ ...o, [l.id]: e.target.value }))} />
        <button class="btn2" onClick=${() => reply(l)}>Enviar</button>
      </div>
    </div>`; })}
  </div>`;
}

function DevView() {
  const st = useStore();
  const status = useStatus();

  const [q, setQ] = useState('');
  const cantores = Object.values(st.cantores).sort((a,b) => (a.name||'').localeCompare(b.name||'','pt-BR'));
  const grupos = Object.values(st.grupos).sort((a,b) => (a.name||'').localeCompare(b.name||'','pt-BR'));
  const eventos = allEvents(st);
  const logs = Object.values(st.log).filter(l => l.type !== 'sugestao').sort((a,b) => (b.at||0) - (a.at||0)).slice(0, 80);
  const novasSug = Object.values(st.log).filter(l => l.type === 'sugestao' && (l.status || 'nova') === 'nova').length;
  const ql = q.toLowerCase();
  const futuro = eventos.filter(e => e.date >= todayStr()).length;

  const resetPass = async (c) => {
    const np = prompt('Nova senha para ' + c.name + ':');
    if (!np || np.length < 4) return;
    await Store.update('cantores', c.id, { passHash: simpleHash(np) });

    toast('Senha redefinida');

  const exportJson = () => {
    const blob = new Blob([JSON.stringify({ exportadoEm: new Date().toISOString(), versao: APP_VERSION, cantores: st.cantores, grupos: st.grupos, eventos: st.eventos }, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'agenda-musical-backup-' + todayStr() + '.json'; a.click();
  };
  const fmtAt = (t) => { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };

  return html`<div class="fade-up" style=${{display:'grid', gap:'12px'}}>
    <div class="glass card">
      <div class="row" style=${{justifyContent:'space-between'}}><div style=${{fontWeight:800}}>🔑 Painel do Desenvolvedor</div><${SyncBadge} /></div>
      <div style=${{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:'8px', marginTop:'12px', textAlign:'center'}}>
        ${[['Cantores', activeCantores(st).length], ['Grupos', activeGrupos(st).length], ['Agendados', futuro], ['Total', eventos.length]].map(([l, n]) => html`<div key=${l} style=${{padding:'10px 4px', borderRadius:'12px', background:'rgba(148,163,184,.08)'}}>
          <div style=${{fontSize:'22px', fontWeight:900}} class="grad-text">${n}</div><div class="dim">${l}</div></div>`)}
      </div>
      <button class="btn2" style=${{width:'100%', marginTop:'10px'}} onClick=${exportJson}>💾 Baixar backup (JSON)</button>
    </div>
    <div class="seg">
      <button class=${tab==='cantores'?'on':''} onClick=${() => setTab('cantores')}>Cantores</button>
      <button class=${tab==='grupos'?'on':''} onClick=${() => setTab('grupos')}>Grupos</button>
      <button class=${tab==='log'?'on':''} onClick=${() => setTab('log')}>Histórico</button>
      <button class=${tab==='sug'?'on':''} onClick=${() => setTab('sug')}>💡 Sugestões${novasSug ? ' (' + novasSug + ')' : ''}</button>
    </div>
    ${tab !== 'log' && html`<input class="inp" placeholder="🔎 Buscar…" value=${q} onInput=${e => setQ(e.target.value)} />`}
    ${tab === 'cantores' && html`<div class="list">${cantores.filter(c => !q || (c.name||'').toLowerCase().includes(ql)).map(c => html`<div key=${c.id} class="item" style=${{flexWrap:'wrap', opacity: c.removed ? .5 : 1}}>
      <${Avatar} name=${c.name} />
      <div style=${{flex:1, minWidth:'140px'}}>

        <div class="dim">@${c.id} · ${c.phone || 'sem WhatsApp'} · ${myGroups(st, c.id).length} grupo(s) · ${eventsOfPerson(st, c.id).length} compromisso(s)</div>

      <div class="row" style=${{gap:'6px'}}>

    ${tab === 'grupos' && html`<div class="list">${grupos.filter(g => !q || (g.name||'').toLowerCase().includes(ql)).map(g => html`<div key=${g.id} class="item" style=${{borderLeft:'5px solid '+g.color, opacity: g.removed ? .5 : 1}}>
      <div style=${{flex:1}}>
        <div style=${{fontWeight:800}}>${g.name} ${g.removed ? '· apagado' : ''}</div>
        <div class="dim">${g.tipo} · ${(g.members||[]).map(m => cantorName(st, m)).join(', ')}</div>

      <button class="btn2 btn-red" style=${{padding:'7px 9px'}} onClick=${() => { if (g.removed || confirm('Apagar o grupo ' + g.name + '?')) Store.update('grupos', g.id, { removed: !g.removed }); }}>${g.removed ? '♻️' : '🗑️'}</button>
    </div>`)}</div>`}
    ${tab === 'sug' && html`<${DevSuggestions} />`}
    ${tab === 'log' && html`<div class="glass card"><table class="t"><tbody>${logs.map(l => html`<tr key=${l.id}>
      <td style=${{width:'26px'}}>${LOGIC[l.type] || '•'}</td>
      <td><b>${l.who}</b> <span class="muted">${l.detail}</span></td>
      <td class="dim" style=${{textAlign:'right', whiteSpace:'nowrap'}}>${fmtAt(l.at)}</td>
    </tr>`)}</tbody></table>${logs.length === 0 && html`<div class="dim">Sem registros ainda.</div>`}</div>`}
  </div>`;
}

// ---------- PÁGINA PÚBLICA: IGREJA AGENDA O GRUPO (sem login) ----------
function PublicBooking({ gid, solo }) {
  const st = useStore();
  const status = useStatus();
  const g = solo ? (st.cantores[gid]?.isGroup ? st.grupos[st.cantores[gid].groupId] : soloTarget(st, gid)) : st.grupos[gid];
  const [month, setMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [day, setDay] = useState(null);
  const [done, setDone] = useState(null);
  const [msg, setMsg] = useState('');
  const tRef = useRef();
  toastFn = (m) => { setMsg(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setMsg(''), 2600); };
  const today = todayStr();

  if (!g || g.removed) {
    const loading = status === 'conectando' || (status !== 'local' && !Object.keys(st.grupos).length);
    return html`<div class="app"><${Brand} sub=" " /><div class="glass card muted" style=${{textAlign:'center'}}>${loading ? '🔄 Carregando agenda…' : 'Esse link de agendamento não existe mais. Peça um link novo ao grupo.'}</div></div>`;
  }
  const dayInfo = (s) => {
    if (s < today) return {};
    const per = ['manha','tarde','noite'].map(p => publicDay(st, g, s, p));
    if (per.every(x => x === 'free')) return { cls:'st-free' };
    if (per.every(x => x === 'busy')) return { cls:'st-busy' };
    return { cls:'st-maybe' };
  };
  const pick = (s) => { if (s < today) return; if (dayInfo(s).cls === 'st-busy') { toast('⛔ Data indisponível. Escolha outra.'); return; } setDay(s); };
  const members = (g.members || []).map(m => cantorName(st, m).split(' ')[0]).join(', ');

  if (done) return html`<div class="app">
    <${Brand} sub=${g.name} />
    <div class="glass card" style=${{display:'grid', gap:'10px', textAlign:'center'}}>
      <div style=${{fontSize:'44px'}}>✅</div>
      <div style=${{fontWeight:900, fontSize:'18px'}}>Pedido enviado!</div>
      <div class="muted">${g.__solo ? '' : 'O '}${g.name} recebeu seu pedido para <b>${fmtDateLong(done.date)}</b> (${PER[done.period].label}). ${g.__solo ? g.name.split(' ')[0] + ' vai confirmar' : 'Eles vão confirmar'} com você${done.church.phone ? ' pelo WhatsApp' : ''}.</div>
      ${done.church.km ? html`<div class="okbox">🚗 ${done.church.km.toFixed(0)} km · deslocamento estimado: <b>${brl(done.church.cost)}</b></div>` : null}
      <button class="btn2" onClick=${() => setDone(null)}>Fazer outro pedido</button>
    </div>
  </div>`;

  return html`<div class="app">
    <div style=${{textAlign:'center', margin:'6px 0 14px'}}>
      <div style=${{display:'flex', justifyContent:'center', marginBottom:'8px'}}><${Avatar} name=${g.name} color=${g.color} img=${g.logo} size=${72} /></div>
      <div style=${{fontWeight:900, fontSize:'21px'}}>${g.name}</div>
      <div class="muted">${g.__solo ? '🎙️ Apresentação solo' : (g.tipo || 'Grupo')}</div>
      <div class="dim" style=${{marginTop:'6px'}}>${g.__solo ? 'Escolha uma data livre para convidar ' + g.name.split(' ')[0] + ' para cantar na sua igreja.' : 'Escolha uma data livre para convidar o grupo para a sua igreja.'}</div>
    </div>
    <div class="glass card">
      <${Calendar} month=${month} setMonth=${setMonth} renderDay=${dayInfo} onPick=${pick} />
      <div class="legend">
        <span><i class="sq" style=${{background:'rgba(16,185,129,.5)'}}></i>Livre</span>
        <span><i class="sq" style=${{background:'var(--maybe)'}}></i>Parte do dia ocupada</span>
        <span><i class="sq" style=${{background:'var(--busy)'}}></i>Indisponível</span>
      </div>
    </div>
    ${g.cost?.valorKm ? html`<div class="glass card" style=${{marginTop:'12px', display:'grid', gap:'4px'}}>
      <div style=${{fontWeight:800}}>🚗 Custo de deslocamento</div>
      <div class="muted">${brl(g.cost.valorKm)} por km ${g.cost.idaVolta === false ? '(só ida)' : '(ida e volta)'}${g.cost.extra ? ' + ' + brl(g.cost.extra) + ' de ' + (g.cost.extraLabel || 'extras') : ''}${g.cost.minimo ? ' · mínimo ' + brl(g.cost.minimo) : ''}.</div>
      <div class="dim">O valor exato aparece quando você informar o endereço da igreja.</div>
      ${g.cost.obs && html`<div class="dim">ℹ️ ${g.cost.obs}</div>`}
    </div>` : null}
    <div class="dim" style=${{textAlign:'center', marginTop:'16px'}}>🎶 Agenda Musical</div>
    ${day && html`<${BookingForm} g=${g} date=${day} onClose=${() => setDay(null)} onDone=${(ev) => { setDay(null); setDone(ev); }} />`}
    <${Toast} msg=${msg} />
  </div>`;
}

function BookingForm({ g, date, onClose, onDone }) {
  const st = useStore();
  const free = PERIODOS.filter(p => p.id !== 'dia' && publicDay(st, g, date, p.id) !== 'busy');
  const [period, setPeriod] = useState(free.find(p => p.id === 'noite')?.id || free[0]?.id || 'noite');
  const [f, setF] = useState({ name:'', contact:'', phone:'', address:'', time:'', notes:'' });
  const [parts, setParts] = useState([]);
  const up = (k) => (e) => setF(o => ({ ...o, [k]: e.target.value }));
  const [quote, setQuote] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const avail = publicDay(st, g, date, period);
  const hasCost = !!g.cost?.valorKm;

  const calc = async () => {
    setErr(''); setQuote(null);
    if (!hasCost || !f.address.trim()) return null;
    setQuote({ loading:true });
    try { const q = await quoteFor(g.cost, f.address); setQuote(q); return q; }
    catch(e) { setQuote({ failed:true }); return null; }
  };
  const submit = async () => {
    setErr('');
    if (avail === 'busy') return setErr('Esse período já está ocupado. Escolha outro período ou outra data.');
    if (!f.name.trim()) return setErr('Informe o nome da igreja.');
    if (!f.contact.trim() || onlyDigits(f.phone).length < 10) return setErr('Informe o nome e o WhatsApp (com DDD) de quem está agendando.');
    if (!f.address.trim()) return setErr('Informe o endereço da igreja.');
    if (!parts.length) return setErr('Escolha o tipo de participação.');
    setBusy(true);
    let q = quote && !quote.loading && !quote.failed ? quote : (hasCost ? await calc() : null);
    const id = uid('ev');
    const ev = {
      id, kind:'apresentacao', ownerType: g.__solo ? 'solo' : 'grupo', ownerId:g.id, date, period, time: f.time || '',
      place: f.name.trim(), notes: f.notes.trim(), parts, status:'pendente', source:'igreja', excluded:[],
      createdBy: '__igreja__', createdAt: Date.now(),
      church: { name: f.name.trim(), contact: f.contact.trim(), phone: f.phone.trim(), address: f.address.trim(),
        km: q ? Math.round(q.km * 10) / 10 : 0, cost: q ? Math.round(q.total * 100) / 100 : 0 },
    };
    const ok = await Store.set('eventos', id, ev);
    setBusy(false);
    if (!ok) return setErr('Não consegui enviar agora. Tente de novo em instantes.');
    Store.log('pedido', f.name.trim(), g.name + ' ' + fmtDate(date));
    onDone(ev);
  };

  return html`<${Sheet} title=${fmtDateLong(date)} onClose=${onClose}>
    <div style=${{display:'grid', gap:'10px'}}>
      ${err && html`<div class="err">${err}</div>`}
      <div class="lbl">Período</div>
      <div class="seg">${PERIODOS.filter(p => p.id !== 'dia').map(p => { const s = publicDay(st, g, date, p.id); return html`<button key=${p.id} class=${period===p.id?'on':''} disabled=${s === 'busy'} onClick=${() => setPeriod(p.id)}>${s === 'busy' ? '⛔ ' + p.label : p.ic + ' ' + p.label}</button>`; })}</div>
      <div class="dim">${PERIODOS.filter(p => p.id !== 'dia' && publicDay(st, g, date, p.id) === 'busy').map(p => p.label).join(', ') ? '⛔ Indisponível: ' + PERIODOS.filter(p => p.id !== 'dia' && publicDay(st, g, date, p.id) === 'busy').map(p => p.label.toLowerCase()).join(', ') + '.' : ''}</div>
      ${avail === 'busy' && html`<div class="err">⛔ Esse período está indisponível. Escolha outro período ou outra data.</div>`}
      <input class="inp" type="time" value=${f.time} onInput=${up('time')} />
      <div class="lbl">Tipo de participação</div>
      <${PartChips} value=${parts} onChange=${setParts} />
      <div class="lbl">Sua igreja</div>
      <input class="inp" placeholder="Nome da igreja" value=${f.name} onInput=${up('name')} />
      <input class="inp" placeholder="Endereço (rua, número, cidade - UF)" value=${f.address} onInput=${e => { up('address')(e); setQuote(null); }} onBlur=${calc} />
      <div class="lbl">Quem está agendando</div>
      <input class="inp" placeholder="Seu nome" value=${f.contact} onInput=${up('contact')} />
      <input class="inp" inputmode="tel" placeholder="WhatsApp com DDD" value=${f.phone} onInput=${up('phone')} />
      <textarea class="inp" rows="2" placeholder="Observação (programa, música desejada…)" value=${f.notes} onInput=${up('notes')}></textarea>
      ${hasCost && html`<div class="glass card" style=${{padding:'12px', display:'grid', gap:'6px'}}>
        <div style=${{fontWeight:800}}>🚗 Deslocamento</div>
        ${!quote && html`<div class="row" style=${{gap:'6px'}}><div class="dim" style=${{flex:1}}>Informe o endereço para calcular.</div><button class="btn2" disabled=${!f.address.trim()} onClick=${calc}>Calcular</button></div>`}
        ${quote?.loading && html`<div class="dim">Calculando a distância…</div>`}
        ${quote?.failed && html`<div class="warnbox">Não consegui calcular pelo mapa. Confira o endereço — ou envie assim mesmo que o grupo calcula pra você.</div>`}
        ${quote && quote.km != null && html`<div>
          <div class="muted">${quote.km.toFixed(1)} km de distância${g.cost.idaVolta === false ? '' : ' (' + quote.kmTotal.toFixed(0) + ' km ida e volta)'} · ~${Math.round(quote.min)} min</div>
          <div style=${{fontSize:'22px', fontWeight:900, marginTop:'4px'}} class="grad-text">${brl(quote.total)}</div>
          ${g.cost.extra ? html`<div class="dim">inclui ${brl(g.cost.extra)} de ${g.cost.extraLabel || 'extras'}</div>` : null}
          <a class="dim" style=${{color:'var(--accent-3)'}} href=${mapsLink(g.cost.origem, f.address)} target="_blank">🗺️ Ver rota no Google Maps</a>
        </div>`}
      </div>`}
      <button class="btn" disabled=${busy || avail === 'busy'} onClick=${submit}>${busy ? 'Enviando…' : 'Enviar pedido de agendamento'}</button>
      <div class="dim" style=${{textAlign:'center'}}>O grupo confirma a data com você depois.</div>
    </div>
  </${Sheet}>`;
}

// Notificação do sistema (celular/computador) pra avisos novos — funciona com o app aberto
// ou minimizado. Com o app totalmente fechado não apita (precisaria de servidor de push).
async function notify(title, body) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    const opts = { body, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'agenda-' + Date.now() };
    if (reg && reg.showNotification) await reg.showNotification(title, opts); else new Notification(title, opts);
  } catch(e) {}
}
function avisoText(st, a) {
  if (a.kind === 'resp') return ['💡 Resposta à sua sugestão', a.sug.reply];
  if (a.kind === 'pedido') return ['⛪ Novo pedido: ' + a.g.name, (a.ev.church?.name || 'Uma igreja') + ' quer agendar em ' + fmtDate(a.ev.date) + ' (' + (PER[a.ev.period]?.label || '') + ')' + ((a.ev.parts || []).length ? ' · ' + a.ev.parts.map(p => p.replace(/^\S+\s/, '')).join(', ') : '')];
  if (a.kind === 'obs') return ['💬 ' + cantorName(st, a.obs.by) + (a.g ? ' · ' + a.g.name : ''), a.obs.text];
  if (a.kind === 'novo' && isEnsaio(a.ev)) return ['🎼 ' + a.g.name + ': ' + (a.ev.extra ? '⭐ ensaio extra' : a.ev.seriesId ? 'ensaios marcados' : 'novo ensaio'), (a.ev.extra ? '' : 'A partir de ') + fmtDateLong(a.ev.date) + (a.ev.focus ? ' · foco: ' + a.ev.focus : '') + ' — marcado por ' + cantorName(st, a.ev.createdBy)];
  if (a.kind === 'novo') return ['📅 ' + a.g.name + ': nova apresentação', fmtDateLong(a.ev.date) + ' — marcado por ' + cantorName(st, a.ev.createdBy)];
  return ['🔴 ' + a.g.name + ' indisponível em ' + fmtDate(a.ev.date), a.who.map(w => cantorName(st, w)).join(', ') + ' tem outro compromisso'];
}

// ---------- APP ----------
function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; }
}

function App() {
  const st = useStore();
  const [session, setSession] = useState(loadSession);
  const [tab, setTab] = useState(() => session?.dev ? 'dev' : 'agenda');
  const [ctx, setCtx] = useState(() => session?.group ? { type:'grupo', id: session.group } : { type:'pessoa', login: session?.login });
  const [msg, setMsg] = useState('');
  const [installPrompt, setInstallPrompt] = useState(null);
  const [avisoDay, setAvisoDay] = useState(null);
  const tRef = useRef();
  toastFn = (m) => { setMsg(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setMsg(''), 2600); };

  useEffect(() => {
    const h = (e) => { e.preventDefault(); setInstallPrompt(e); };
    window.addEventListener('beforeinstallprompt', h);
    return () => window.removeEventListener('beforeinstallprompt', h);
  }, []);

  const me = session?.login || null;
  const avisos = useMemo(() => buildAvisos(st, me), [st, me]);
  // Dispara notificação só pros avisos que chegaram DEPOIS do app abrir e da nuvem carregar.
  const notifiedRef = useRef(null);
  const status = useStatus();
  useEffect(() => {
    if (!me) return;
    if (notifiedRef.current === null) {
      if (status === 'conectando') return;
      notifiedRef.current = new Set(avisos.map(a => a.id));
      return;
    }
    avisos.forEach(a => {
      if (notifiedRef.current.has(a.id)) return;
      notifiedRef.current.add(a.id);
      if (a.at < Date.now() - 10 * 60 * 1000) return;
      const [t1, t2] = avisoText(st, a);
      notify(t1, t2);
    });
  }, [avisos, status, me]);
  const extendedRef = useRef(false);
  useEffect(() => {
    if (!me || extendedRef.current || status === 'conectando') return;
    extendedRef.current = true;
    extendOpenSeries(st, me).catch(() => {});
  }, [status, me]);
  const seenAt = Number((me && localStorage.getItem(SEEN_KEY + me)) || 0);
  const unread = tab === 'avisos' ? 0 : avisos.filter(a => a.at > seenAt).length;

  // Se o cantor foi removido/pausado pelo desenvolvedor, sai sozinho.
  useEffect(() => {
    if (!me) return;
    const c = st.cantores[me];
    if (c && (c.removed || c.paused)) logout();
  }, [st.cantores, me]);
  // Se o grupo selecionado foi apagado ou a pessoa saiu dele, volta pra agenda pessoal.
  useEffect(() => {
    if (session?.group) return;
    if (ctx.type === 'grupo' && me && !myGroups(st, me).some(g => g.id === ctx.id)) setCtx({ type:'pessoa', login: me });
  }, [st.grupos]);

  const login = (s, remember) => {
    try { (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify(s)); } catch(e) {}
    setSession(s); setTab(s.dev ? 'dev' : 'agenda'); setCtx(s.group ? { type:'grupo', id: s.group } : { type:'pessoa', login: s.login });
  };
  function logout() {
    try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
    setSession(null);
  }

  if (!session) return html`<${UpdateBanner} /><${LoginScreen} onLogin=${login} /><${Toast} msg=${msg} />`;

  const gAcct = session.group ? st.grupos[session.group] : null;
  const tabs = session.dev
    ? [['dev','🔑','Painel'], ['todos','🌐','Todos']]
    : session.group
    ? [['agenda','📅','Agenda'], ['avisos','🔔','Avisos'], ['sug','💡','Sugestões'], ['perfil','⚙️','Configurações']]
    : [['agenda','📅','Agenda'], ['avisos','🔔','Avisos'], ['sug','💡','Sugestões'], ['perfil','⚙️','Configurações']];
  const title = session.dev ? 'Desenvolvedor' : callName(st, me);

  return html`
    <div class="app">
      <${UpdateBanner} />
      <div class="topbar">
        <div class="logo">🎶</div>
        <div style=${{flex:1, minWidth:0}}>
          <div class="grad-text" style=${{fontWeight:900, fontSize:'17px'}}>Agenda Musical</div>
          ${session.dev ? html`<div class="dim">Olá, ${title}</div>` : html`<button onClick=${() => setTab('perfil')} style=${{border:'none', background:'none', padding:0, color:'var(--text-dim, #94a3b8)', fontSize:'12.5px'}}>Olá, ${title} · ⚙️ configurações</button>`}
        </div>
        <${SyncBadge} />
        ${session.dev && html`<button class="btn2" style=${{padding:'7px 10px'}} onClick=${logout}>Sair</button>`}
      </div>

      ${tab === 'agenda' && html`<${AgendaView} me=${me} ctx=${ctx} setCtx=${setCtx} showChips=${!session.group} />`}
      ${tab === 'integrantes' && gAcct && html`<div class="fade-up glass card"><div style=${{fontWeight:900, fontSize:'17px', marginBottom:'10px'}}>👥 ${gAcct.name}</div><${GroupPanel} me=${me} g=${gAcct} onClose=${() => {}} onEdit=${() => setTab('perfil')} onAgenda=${() => setTab('agenda')} /></div>`}
      ${tab === 'grupos' && html`<${GroupsView} me=${me} openAgenda=${(c) => { setCtx(c); setTab('agenda'); }} />`}
      ${tab === 'todos' && session.dev && html`<${AllView} me=${me} />`}
      ${tab === 'avisos' && html`<${AvisosView} me=${me} avisos=${avisos} openDay=${(a) => a.kind === 'resp' ? setTab('sug') : setAvisoDay(a)} />`}
      ${tab === 'perfil' && (session.group ? html`<${GroupProfile} me=${me} onLogout=${logout} installPrompt=${installPrompt} onAgenda=${() => setTab('agenda')} />` : html`<${ProfileView} me=${me} onLogout=${logout} installPrompt=${installPrompt} openAgenda=${(c) => { setCtx(c); setTab('agenda'); }} onBecomeGroup=${(gid) => { const s2 = { login: me, group: gid }; try { (localStorage.getItem(SESSION_KEY) ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify(s2)); } catch(e) {} setSession(s2); setCtx({ type:'grupo', id: gid }); setTab('perfil'); }} />`)}
      ${tab === 'sug' && html`<${SuggestionsView} me=${me} />`}
      ${tab === 'dev' && html`<${DevView} />`}

      ${avisoDay && html`<${DaySheet} me=${me}
          ctx=${avisoDay.kind === 'bloqueio' || !(avisoDay.ev.ownerType === 'grupo') ? (avisoDay.kind === 'bloqueio' ? { type:'grupo', id: avisoDay.g.id } : { type:'pessoa', login: me }) : { type:'grupo', id: avisoDay.ev.ownerId }}
          date=${avisoDay.ev.date} readOnly=${avisoDay.kind === 'bloqueio'} onClose=${() => setAvisoDay(null)}
          onNew=${() => setAvisoDay(null)} onEdit=${() => setAvisoDay(null)} />`}

      <div class="nav"><div class="nav-in glass">
        ${tabs.map(([id, ic, label]) => html`<button key=${id} class=${tab===id?'on':''} onClick=${() => setTab(id)}>
          <span class="ic">${ic}</span>${label}
          ${id === 'avisos' && unread > 0 && html`<span class="badge">${unread}</span>`}
        </button>`)}
      </div></div>
      <${Toast} msg=${msg} />
    </div>`;
}

// Link público das igrejas (?agendar=ID) abre só a página de agendamento, sem login.
const QS = new URLSearchParams(location.search);
const AGENDAR_ID = QS.get('agendar'), SOLO_ID = QS.get('solo');
ReactDOM.createRoot(document.getElementById('root')).render(
  AGENDAR_ID ? html`<${PublicBooking} gid=${AGENDAR_ID} />`
  : SOLO_ID ? html`<${PublicBooking} gid=${SOLO_ID} solo=${true} />`
  : html`<${App} />`);

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
