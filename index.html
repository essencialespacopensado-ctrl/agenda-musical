  .sq { width:12px; height:12px; border-radius:4px; display:inline-block; }

  .avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#fff; flex-shrink:0; }
  .list { display:grid; gap:8px; }
  .item { display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:14px; border:1px solid var(--border-soft); background:rgba(148,163,184,.05); color:var(--text-hi); width:100%; text-align:left; }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); transform:translateX(-50%); z-index:60; padding:11px 16px; border-radius:12px; background:#111827; border:1px solid var(--border-soft); font-size:14px; font-weight:700; box-shadow:0 10px 30px -10px #000; animation:fadeUp .25s ease both; max-width:90vw; text-align:center; }
  table.t { width:100%; border-collapse:collapse; font-size:13px; }
  table.t td { padding:7px 4px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
</style>

<script>

  window.__FIREBASE_CONFIG__ = {
    apiKey: "AIzaSyAHE_hlXxmRXn0MoZEPNbMxqZDSjM9Zk0U",
    authDomain: "gerenciador-de-culto.firebaseapp.com",
    projectId: "gerenciador-de-culto",
    storageBucket: "gerenciador-de-culto.firebasestorage.app",

<script type="module">
  window.__fb = { ready:false, db:null, h:null, error:null };
  (async () => {
    if (window.__LOCAL_MODE__) { window.__fb.error = 'local'; window.dispatchEvent(new Event('fb-error')); return; }
    try {
      const V = '10.13.1';
      const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
      const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
      const app = initializeApp(window.__FIREBASE_CONFIG__, 'agenda-musical');
      let db;
      try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
      catch (e) { db = F.getFirestore(app); }
      window.__fb.db = db; window.__fb.h = F; window.__fb.ready = true;
      window.dispatchEvent(new Event('fb-ready'));
    } catch (e) {
      window.__fb.error = String(e);
      window.dispatchEvent(new Event('fb-error'));
    }
  })();
</script>
<script>
const html = htm.bind(React.createElement);
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const APP_VERSION = '2026-09-27.01';
const DEV = { login:'paulo', password:'221844', name:'Paulo' };
const COL = { cantores:'agenda_cantores', grupos:'agenda_grupos', eventos:'agenda_eventos', log:'agenda_log' };
const CACHE_KEY = 'am_cache_v1';
const SESSION_KEY = 'am_session_v1';
const SEEN_KEY = 'am_avisos_seen_v1';

const PERIODOS = [
  { id:'manha', label:'Manhã', ic:'🌅' },
  { id:'tarde', label:'Tarde', ic:'☀️' },
  { id:'noite', label:'Noite', ic:'🌙' },
  { id:'dia',   label:'Dia todo', ic:'📅' },
];
const PER = Object.fromEntries(PERIODOS.map(p => [p.id, p]));
const TIPOS = ['Dueto','Trio','Quarteto','Quinteto','Grupo vocal','Coral','Banda','Outro'];
const CORES = ['#3b82f6','#8b5cf6','#10b981','#f59e0b','#06b6d4','#ef4444','#14b8a6','#a855f7','#84cc16','#f97316'];
const SOLO_COLOR = '#ec4899';
const BLOCK_COLOR = '#64748b';
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW = ['D','S','T','Q','Q','S','S'];
const DOW_LONG = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

// ---------- utilidades ----------
function simpleHash(str) {
  const s = 'am-salt-2026::' + String(str || '');
  let h1 = 0x811c9dc5, h2 = 0xdeadbeef;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2654435761); }
  return (h1>>>0).toString(16).padStart(8,'0') + (h2>>>0).toString(16).padStart(8,'0');
}
const uid = (p) => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = (n) => String(n).padStart(2,'0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const parseYmd = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtDate = (s) => { const d = parseYmd(s); return pad(d.getDate()) + '/' + pad(d.getMonth()+1); };
const fmtDateLong = (s) => { const d = parseYmd(s); return DOW_LONG[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()].toLowerCase(); };
const initials = (n) => (n||'?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
const normLogin = (s) => (s||'').trim().toLowerCase().replace(/\s+/g,'.').normalize('NFD').replace(/[̀-ͯ]/g,'');
const overlap = (a, b) => a === 'dia' || b === 'dia' || a === b;
const onlyDigits = (s) => (s||'').replace(/\D/g,'');
function waLink(phone, text) {
  let d = onlyDigits(phone); if (!d) return null;
  if (d.length <= 11) d = '55' + d;
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(text || '');
}

// ---------- banco de dados (nuvem + cópia local) ----------
// Tudo que é mudado vai direto pra nuvem (Firestore) — não existe botão "Salvar geral".
// Uma cópia fica guardada no aparelho pra abrir rápido e funcionar sem internet;
// quando a internet volta, o Firestore envia sozinho o que ficou pendente.
const Store = (() => {
  let state = { cantores:{}, grupos:{}, eventos:{}, log:{} };
  try { const raw = localStorage.getItem(CACHE_KEY); if (raw) state = { ...state, ...JSON.parse(raw) }; } catch(e) {}
  let status = window.__LOCAL_MODE__ ? 'local' : 'conectando';
  let pending = {};
  const subs = new Set();
  let saveT = null;
  const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch(e) {} }, 250); };
  const emit = () => { persist(); subs.forEach(f => f()); };
  const isCloud = () => !!(window.__fb && window.__fb.ready);

  function startCloud() {
    const { collection, onSnapshot } = window.__fb.h;
    const db = window.__fb.db;
    Object.entries(COL).forEach(([key, name]) => {
      onSnapshot(collection(db, name), { includeMetadataChanges:true }, (snap) => {
        const next = {};
        snap.forEach(d => { next[d.id] = { ...d.data(), id:d.id }; });
        state = { ...state, [key]: next };
        pending[key] = snap.metadata.hasPendingWrites;
        const anyPending = Object.values(pending).some(Boolean);
        status = anyPending ? 'salvando' : (snap.metadata.fromCache ? 'offline' : 'nuvem');
        emit();
      }, (err) => { status = 'erro'; console.error(err); emit(); });
    });
  }
  if (isCloud()) startCloud();
  else window.addEventListener('fb-ready', startCloud, { once:true });
  window.addEventListener('fb-error', () => { if (!isCloud()) { status = 'local'; emit(); } }, { once:true });
  window.addEventListener('online', () => emit());
  window.addEventListener('offline', () => { if (status === 'nuvem') status = 'offline'; emit(); });
  // No modo local, outra aba do mesmo aparelho também vê a mudança.
  window.addEventListener('storage', (e) => { if (e.key === CACHE_KEY && !isCloud() && e.newValue) { try { state = JSON.parse(e.newValue); subs.forEach(f => f()); } catch(_){} } });

  const localSet = (key, id, obj) => { state = { ...state, [key]: { ...state[key], [id]: { ...obj, id } } }; emit(); };
  const localDel = (key, id) => { const c = { ...state[key] }; delete c[id]; state = { ...state, [key]: c }; emit(); };
  const clean = (o) => JSON.parse(JSON.stringify(o)); // tira undefined (Firestore não aceita)

  return {
    get: () => state,
    status: () => status,
    subscribe: (f) => { subs.add(f); return () => subs.delete(f); },
    async set(key, id, obj) {
      const data = clean({ ...obj, updatedAt: Date.now() }); delete data.id;
      if (!isCloud()) { localSet(key, id, data); return true; }
      localSet(key, id, data); // mostra na hora, antes da nuvem confirmar
      const { doc, setDoc } = window.__fb.h;
      try { await setDoc(doc(window.__fb.db, COL[key], id), data); return true; } catch(e) { console.error(e); status='erro'; emit(); return false; }
    },
    async update(key, id, fields) {
      const cur = state[key][id] || {};
      const data = clean({ ...fields, updatedAt: Date.now() });
      if (!isCloud()) { localSet(key, id, { ...cur, ...data }); return true; }
      localSet(key, id, { ...cur, ...data });
      const { doc, setDoc } = window.__fb.h;
      try { await setDoc(doc(window.__fb.db, COL[key], id), data, { merge:true }); return true; } catch(e) { console.error(e); status='erro'; emit(); return false; }
    },
    async remove(key, id) {
      if (!isCloud()) { localDel(key, id); return true; }
      localDel(key, id);
      const { doc, deleteDoc } = window.__fb.h;
      try { await deleteDoc(doc(window.__fb.db, COL[key], id)); return true; } catch(e) { console.error(e); return false; }
    },
    // Cadastro de cantor usa o próprio usuário como ID do documento e uma transação:
    // dois cadastros com o mesmo usuário, mesmo ao mesmo tempo, nunca criam duplicado.
    async createCantor(login, obj) {
      const data = clean({ ...obj, updatedAt: Date.now() });
      if (!isCloud()) {
        const ex = state.cantores[login];
        if (ex && !ex.removed) return { taken:true };
        localSet('cantores', login, data); return { ok:true };
      }
      const { doc, runTransaction } = window.__fb.h;
      const ref = doc(window.__fb.db, COL.cantores, login);
      let taken = false;
      try {
        await runTransaction(window.__fb.db, async (tx) => {
          const s = await tx.get(ref);
          if (s.exists() && !s.data().removed) { taken = true; return; }
          tx.set(ref, data);
        });
      } catch(e) { console.error(e); return { error:true }; }
      if (!taken) localSet('cantores', login, data);
      return taken ? { taken:true } : { ok:true };
    },
    log(type, who, detail) {
      const id = uid('log');
      this.set('log', id, { type, who: who || '', detail: detail || '', at: Date.now() });
    }
  };
})();

function useStore() {
  const [, force] = useState(0);
  useEffect(() => Store.subscribe(() => force(n => n + 1)), []);
  return Store.get();
}
function useStatus() {
  const [s, setS] = useState(Store.status());
  useEffect(() => Store.subscribe(() => setS(Store.status())), []);
  return s;
}

// ---------- regras da agenda ----------
const activeCantores = (st) => Object.values(st.cantores).filter(c => !c.removed);
const activeGrupos = (st) => Object.values(st.grupos).filter(g => !g.removed);
const myGroups = (st, login) => activeGrupos(st).filter(g => (g.members||[]).includes(login)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));

// Quem participa de um compromisso. Em grupo, são os integrantes ATUAIS (menos quem ficou
// de fora por ter substituto) — assim, se alguém entra no grupo depois, já fica ocupado também.
function participantsOf(st, ev) {
  if (ev.ownerType === 'grupo') {
    const g = st.grupos[ev.ownerId];
    if (!g || g.removed) return [];
    return (g.members||[]).filter(m => !(ev.excluded||[]).includes(m));
  }
  return [ev.ownerId];
}
function ownerName(st, ev) {
  if (ev.ownerType === 'grupo') return st.grupos[ev.ownerId]?.name || 'Grupo removido';
  if (ev.kind === 'bloqueio') return 'Compromisso pessoal';
  return 'Solo';
}
function ownerColor(st, ev) {
  if (ev.kind === 'bloqueio') return BLOCK_COLOR;
  if (ev.ownerType === 'grupo') return st.grupos[ev.ownerId]?.color || '#3b82f6';
  return SOLO_COLOR;
}
function cantorName(st, login) { return st.cantores[login]?.name || login; }
const allEvents = (st) => Object.values(st.eventos).filter(e => e.date);
const eventsOn = (st, date) => allEvents(st).filter(e => e.date === date);

// Compromissos de uma pessoa (solo, bloqueios e todos os grupos dela).
function eventsOfPerson(st, login) {
  return allEvents(st).filter(e => participantsOf(st, e).includes(login));
}
// Conflitos de uma lista de pessoas numa data/período (ignorando um compromisso específico).
function conflictsFor(st, logins, date, period, ignoreId) {
  const out = [];
  eventsOn(st, date).forEach(e => {
    if (e.id === ignoreId || !overlap(e.period, period)) return;
    const parts = participantsOf(st, e);
    logins.forEach(l => { if (parts.includes(l)) out.push({ login:l, ev:e }); });
  });
  return out;
}
// Situação de um grupo num dia: compromisso do próprio grupo e integrantes ocupados em outra coisa.
function groupDay(st, g, date) {
  const evs = eventsOn(st, date);
  const own = evs.filter(e => e.ownerType === 'grupo' && e.ownerId === g.id);
  const busy = [];
  evs.forEach(e => {
    if (e.ownerType === 'grupo' && e.ownerId === g.id) return;
    const parts = participantsOf(st, e);
    (g.members||[]).forEach(m => { if (parts.includes(m)) busy.push({ login:m, ev:e }); });
  });
  return { own, busy };
}
function describeEv(st, ev) {
  const p = PER[ev.period] || PER.dia;
  return `${ownerName(st, ev)} · ${p.label}${ev.time ? ' ' + ev.time : ''}${ev.place ? ' · ' + ev.place : ''}`;
}

// Avisos: quando alguém de um grupo meu marca outra coisa (solo, outro grupo ou bloqueio),
// o meu grupo fica indisponível nesse dia — e eu fico sabendo. Também avisa quando outro
// integrante marca uma apresentação pro meu grupo.
function buildAvisos(st, login) {
  if (!login) return [];
  const today = todayStr();
  const groups = myGroups(st, login);
  const out = [];
  allEvents(st).forEach(e => {
    if (e.date < today) return;
    const parts = participantsOf(st, e);
    groups.forEach(g => {
      if (e.ownerType === 'grupo' && e.ownerId === g.id) {
        if (e.createdBy && e.createdBy !== login) out.push({ id:e.id+'|'+g.id, kind:'novo', g, ev:e, at:e.createdAt||0 });
        return;
      }
      const who = (g.members||[]).filter(m => m !== login && parts.includes(m));
      if (who.length) out.push({ id:e.id+'|'+g.id, kind:'bloqueio', g, ev:e, who, at:e.createdAt||0 });
    });
  });
  return out.sort((a,b) => b.at - a.at);
}

function LoginScreen({ onLogin }) {
  const st = useStore();

  const [devUser, setDevUser] = useState('');
  const [pass, setPass] = useState('');

  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [forgot, setForgot] = useState(false);
  const [f, setF] = useState({ name:'', phone:'', login:'', pass:'', q:'', a:'' });
  const up = (k) => (e) => setF(o => ({ ...o, [k]: e.target.value }));
  const cantores = useMemo(() => activeCantores(st).sort((a,b) => a.name.localeCompare(b.name,'pt-BR')), [st.cantores]);

  const doLogin = (e) => {
    e.preventDefault(); setErr('');
    if (who === '__dev__') {
      if (devUser.trim().toLowerCase() === DEV.login && pass === DEV.password) { onLogin({ dev:true }, remember); return; }
      setErr('Usuário ou senha do desenvolvedor incorretos.'); return;
    }
    if (!who) { setErr('Escolha seu nome na lista.'); return; }
    const c = st.cantores[who];
    if (!c || c.removed) { setErr('Cadastro não encontrado.'); return; }
    if (c.passHash !== simpleHash(pass)) { setErr('Senha incorreta.'); return; }
    if (c.paused) { setErr('Seu acesso está pausado. Fale com o Paulo.'); return; }
    Store.log('login', c.name);
    onLogin({ login: who }, remember);
  };

  const doRegister = async (e) => {
    e.preventDefault(); setErr('');
    const login = normLogin(f.login || f.name);
    if (!f.name.trim()) return setErr('Digite seu nome.');
    if (!login || login.length < 3) return setErr('Escolha um usuário com pelo menos 3 letras.');
    if (login === DEV.login) return setErr('Esse usuário é reservado. Escolha outro.');
    if (f.pass.length < 4) return setErr('A senha precisa ter pelo menos 4 caracteres.');
    if (!f.q.trim() || !f.a.trim()) return setErr('Preencha a pergunta e a resposta de segurança (servem pra recuperar a senha).');
    setBusy(true);
    const r = await Store.createCantor(login, {
      name: f.name.trim(), phone: f.phone.trim(), login,
      passHash: simpleHash(f.pass), q: f.q.trim(), aHash: simpleHash(f.a.trim().toLowerCase()),
      createdAt: Date.now(), removed:false, paused:false
    });
    setBusy(false);
    if (r.taken) return setErr('Esse usuário já existe. Escolha outro.');
    if (r.error) return setErr('Não consegui salvar na nuvem agora. Verifique a internet e tente de novo.');
    Store.log('cadastro', f.name.trim());
    onLogin({ login }, true);
  };

  return html`
    <div style=${{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'20px'}}>
      <div class="fade-up" style=${{width:'100%', maxWidth:'430px'}}>
        <${Brand} />
        <div class="glass card" style=${{borderRadius:'22px', padding:'20px', display:'grid', gap:'14px'}}>
          <div class="seg">
            <button class=${mode==='login'?'on':''} onClick=${() => { setMode('login'); setErr(''); }}>Entrar</button>
            <button class=${mode==='register'?'on':''} onClick=${() => { setMode('register'); setErr(''); }}>Criar conta</button>
          </div>
          ${err && html`<div class="err">${err}</div>`}
          ${mode === 'login' ? html`
            <form onSubmit=${doLogin} style=${{display:'grid', gap:'10px'}}>
              <select class="inp" value=${who} onChange=${e => setWho(e.target.value)}>
                <option value="">Quem é você?</option>
                ${cantores.map(c => html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}
                <option value="__dev__">🔑 Acesso do Desenvolvedor</option>
              </select>
              ${who === '__dev__' && html`<input class="inp" placeholder="Usuário do desenvolvedor" value=${devUser} onInput=${e => setDevUser(e.target.value)} />`}
              <${PasswordInput} value=${pass} onChange=${setPass} />
              <label class="row muted" style=${{gap:'8px'}}>
                <input type="checkbox" checked=${remember} onChange=${e => setRemember(e.target.checked)} style=${{width:'18px', height:'18px'}} />
                Manter conectado neste aparelho
              </label>
              <button class="btn" type="submit">Entrar</button>
              <button class="link" type="button" onClick=${() => setForgot(true)}>Esqueci minha senha</button>
              <div class="dim" style=${{textAlign:'center'}}>Seu nome não está na lista? Toque em <b>Criar conta</b>.</div>
            </form>
          ` : html`
            <form onSubmit=${doRegister} style=${{display:'grid', gap:'10px'}}>
              <div class="lbl">Seus dados</div>
              <input class="inp" placeholder="Nome (como os grupos te conhecem)" value=${f.name} onInput=${up('name')} autoFocus />
              <input class="inp" placeholder="WhatsApp (com DDD)" inputmode="tel" value=${f.phone} onInput=${up('phone')} />
              <div class="lbl">Acesso</div>
              <input class="inp" placeholder=${'Usuário' + (f.name ? ' (ex: ' + normLogin(f.name) + ')' : '')} value=${f.login} onInput=${up('login')} autocapitalize="off" />
              <${PasswordInput} value=${f.pass} onChange=${v => setF(o => ({ ...o, pass:v }))} placeholder="Senha (mínimo 4)" />
              <div class="lbl">Pra recuperar a senha</div>
              <input class="inp" placeholder="Pergunta (ex: nome da minha primeira igreja)" value=${f.q} onInput=${up('q')} />
              <input class="inp" placeholder="Resposta" value=${f.a} onInput=${up('a')} />
              <button class="btn" type="submit" disabled=${busy}>${busy ? 'Criando…' : 'Criar minha conta'}</button>
            </form>
          `}
        </div>

      </div>

}

// ---------- CALENDÁRIO ----------
function Calendar({ month, setMonth, renderDay, onPick }) {
  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const days = []; for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
  const today = todayStr();
  const lastRowUsed = days.slice(35).some(d => d.getMonth() === month.getMonth());
  const shown = lastRowUsed ? days : days.slice(0, 35);
  const shift = (n) => setMonth(new Date(month.getFullYear(), month.getMonth() + n, 1));
  return html`
    <div>
      <div class="cal-head">
        <button onClick=${() => shift(-1)}>‹</button>
        <button onClick=${() => setMonth(new Date(new Date().getFullYear(), new Date().getMonth(), 1))} style=${{width:'auto', border:'none', background:'none', fontWeight:800, fontSize:'17px', padding:'0 6px'}}>${MESES[month.getMonth()]} ${month.getFullYear()}</button>
        <button onClick=${() => shift(1)}>›</button>
      </div>
      <div class="cal">
        ${DOW.map((d,i) => html`<div class="dow" key=${'w'+i}>${d}</div>`)}
        ${shown.map(d => {
          const s = ymd(d);
          const info = renderDay(s) || {};
          const cls = ['day', d.getMonth() !== month.getMonth() ? 'out' : '', s < today ? 'past' : '', s === today ? 'today' : '', info.cls || ''].join(' ');
          return html`<button key=${s} class=${cls} onClick=${() => onPick(s)}>
            <span>${d.getDate()}</span>
            ${info.dots && info.dots.length ? html`<div class="dots">${info.dots.slice(0,4).map((c,i) => html`<span key=${i} class="dot" style=${{background:c}}></span>`)}</div>` : null}
          </button>`;
        })}
      </div>
    </div>`;
}

function AgendaView({ me, ctx, setCtx, readOnly, showChips }) {
  const st = useStore();
  const [month, setMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [day, setDay] = useState(null);
  const [form, setForm] = useState(null);
  const groups = me ? myGroups(st, me) : [];
  const g = ctx.type === 'grupo' ? st.grupos[ctx.id] : null;
  const today = todayStr();

  const personEvents = useMemo(() => ctx.type === 'pessoa' ? eventsOfPerson(st, ctx.login) : [], [st, ctx.type, ctx.login]);
  const byDate = useMemo(() => { const m = {}; personEvents.forEach(e => { (m[e.date] = m[e.date] || []).push(e); }); return m; }, [personEvents]);

  const renderDay = (s) => {
    if (ctx.type === 'pessoa') {
      const evs = byDate[s] || [];
      return { dots: evs.map(e => ownerColor(st, e)), cls: evs.length ? '' : '' };
    }
    if (!g) return {};
    const { own, busy } = groupDay(st, g, s);
    if (own.length) return { cls: own.every(e => e.status === 'pendente') ? 'st-maybe' : 'st-mine', dots: busy.length ? ['#ef4444'] : [] };
    if (busy.length) return { cls:'st-busy' };
    return { cls: s >= today ? 'st-free' : '' };
  };

  const upcoming = useMemo(() => {
    const list = ctx.type === 'pessoa' ? personEvents : allEvents(st).filter(e => e.ownerType === 'grupo' && e.ownerId === ctx.id);
    return list.filter(e => e.date >= today).sort((a,b) => (a.date + (a.time||'')).localeCompare(b.date + (b.time||''))).slice(0, 8);
  }, [st, ctx, personEvents]);

  const busyUpcoming = useMemo(() => {
    if (!g) return [];
    const seen = {}; const out = [];
    allEvents(st).filter(e => e.date >= today).forEach(e => {
      if (e.ownerType === 'grupo' && e.ownerId === g.id) return;
      const parts = participantsOf(st, e);
      const who = (g.members||[]).filter(m => parts.includes(m));
      if (who.length) out.push({ e, who });
    });
    return out.sort((a,b) => a.e.date.localeCompare(b.e.date)).slice(0, 8);
  }, [st, g]);

  const canEditCtx = !readOnly && me && (ctx.type === 'pessoa' ? ctx.login === me : (g && (g.members||[]).includes(me)));

  return html`
    <div class="fade-up" style=${{display:'grid', gap:'12px'}}>
      ${showChips && html`<div class="chips">
        <button class=${'chip ' + (ctx.type==='pessoa' ? 'on' : '')} style=${ctx.type==='pessoa' ? {background:'linear-gradient(135deg,var(--accent-1),var(--accent-2))'} : null} onClick=${() => setCtx({ type:'pessoa', login:me })}>👤 Minha agenda</button>
        ${groups.map(x => html`<button key=${x.id} class=${'chip ' + (ctx.type==='grupo' && ctx.id===x.id ? 'on' : '')} style=${ctx.type==='grupo' && ctx.id===x.id ? {background:x.color} : {borderColor:x.color+'88'}} onClick=${() => setCtx({ type:'grupo', id:x.id })}>🎤 ${x.name}</button>`)}
      </div>`}

      <div class="glass card">
        ${g && html`<div class="row" style=${{marginBottom:'10px'}}>
          <div class="sq" style=${{background:g.color, width:'14px', height:'14px'}}></div>
          <div style=${{fontWeight:800}}>${g.name}</div>
          <div class="dim">· ${g.tipo} · ${(g.members||[]).length} integrante${(g.members||[]).length===1?'':'s'}</div>
        </div>`}
        ${!g && ctx.type === 'pessoa' && ctx.login !== me && html`<div class="row" style=${{marginBottom:'10px'}}>
          <${Avatar} name=${cantorName(st, ctx.login)} size=${28} />
          <div style=${{fontWeight:800}}>${cantorName(st, ctx.login)}</div>
        </div>`}
        <${Calendar} month=${month} setMonth=${setMonth} renderDay=${renderDay} onPick=${setDay} />
        ${ctx.type === 'grupo' ? html`<div class="legend">
          <span><i class="sq" style=${{background:'rgba(16,185,129,.5)'}}></i>Livre</span>
          <span><i class="sq" style=${{background:'var(--mine)'}}></i>Agendado</span>
          <span><i class="sq" style=${{background:'var(--maybe)'}}></i>A confirmar</span>
          <span><i class="sq" style=${{background:'var(--busy)'}}></i>Indisponível</span>
        </div>` : html`<div class="legend">
          <span><i class="dot" style=${{background:SOLO_COLOR}}></i>Solo</span>
          ${myGroups(st, ctx.login).map(x => html`<span key=${x.id}><i class="dot" style=${{background:x.color}}></i>${x.name}</span>`)}
          <span><i class="dot" style=${{background:BLOCK_COLOR}}></i>Pessoal</span>
        </div>`}
      </div>

      ${canEditCtx && html`<div class="row">
        <button class="btn" onClick=${() => setForm({ date: today >= ymd(month) ? today : ymd(month), ctx })}>➕ Agendar apresentação</button>
        ${ctx.type === 'pessoa' && html`<button class="btn2" style=${{whiteSpace:'nowrap'}} onClick=${() => setForm({ date: today, ctx, bloqueio:true })}>🚫 Bloquear dia</button>`}
      </div>`}

      <div>
        <div class="lbl" style=${{marginBottom:'8px'}}>Próximos compromissos</div>
        ${upcoming.length ? html`<div class="list">${upcoming.map(e => html`<${EventRow} key=${e.id} ev=${e} onClick=${() => setDay(e.date)} />`)}</div>`
          : html`<div class="dim">Nada agendado ainda.</div>`}
      </div>

      ${g && busyUpcoming.length > 0 && html`<div>
        <div class="lbl" style=${{marginBottom:'8px'}}>Datas indisponíveis (integrante ocupado)</div>
        <div class="list">${busyUpcoming.map(({e, who}) => html`<button key=${e.id} class="item" onClick=${() => setDay(e.date)}>
          <div style=${{fontSize:'20px'}}>🔴</div>
          <div style=${{flex:1}}>
            <div style=${{fontWeight:700}}>${fmtDateLong(e.date)} · ${PER[e.period]?.label}</div>
            <div class="dim">${who.map(w => cantorName(st, w)).join(', ')} — ${ownerName(st, e)}</div>
          </div>
        </button>`)}</div>
      </div>`}

      ${day && html`<${DaySheet} me=${me} ctx=${ctx} date=${day} readOnly=${!canEditCtx} onClose=${() => setDay(null)}
          onNew=${(o) => { setDay(null); setForm({ date: day, ctx, ...o }); }}
          onEdit=${(ev) => { setDay(null); setForm({ ev, ctx }); }} />`}
      ${form && html`<${EventForm} me=${me} init=${form} onClose=${() => setForm(null)} />`}
    </div>`;
}

function EventRow({ ev, onClick }) {
  const st = useStore();
  const p = PER[ev.period] || PER.dia;
  const d = parseYmd(ev.date);
  return html`<button class="item" onClick=${onClick} style=${{borderLeft:'5px solid ' + ownerColor(st, ev)}}>
    <div style=${{textAlign:'center', minWidth:'40px'}}>
      <div style=${{fontSize:'20px', fontWeight:900, lineHeight:1}}>${d.getDate()}</div>
      <div class="dim" style=${{fontSize:'11px'}}>${MESES[d.getMonth()].slice(0,3)}</div>
    </div>
    <div style=${{flex:1, minWidth:0}}>
      <div style=${{fontWeight:800}}>${ev.kind === 'bloqueio' ? '🚫 ' + (ev.place || 'Compromisso pessoal') : ownerName(st, ev)}${ev.status === 'pendente' ? html` <span style=${{color:'var(--maybe)', fontSize:'12px'}}>· a confirmar</span>` : ''}</div>
      <div class="dim" style=${{whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>${p.ic} ${p.label}${ev.time ? ' ' + ev.time : ''}${ev.kind !== 'bloqueio' && ev.place ? ' · ' + ev.place : ''}</div>
    </div>

}

function DaySheet({ me, ctx, date, readOnly, onClose, onNew, onEdit }) {
  const st = useStore();
  const g = ctx.type === 'grupo' ? st.grupos[ctx.id] : null;
  let own = [], busy = [];
  if (g) { const r = groupDay(st, g, date); own = r.own; busy = r.busy; }
  else own = eventsOn(st, date).filter(e => participantsOf(st, e).includes(ctx.login));

  const canTouch = (ev) => !readOnly && me && (ev.ownerType === 'grupo' ? (st.grupos[ev.ownerId]?.members||[]).includes(me) : ev.ownerId === me);
  const del = async (ev) => {
    if (!confirm('Excluir esse compromisso? A data volta a ficar livre pros grupos.')) return;
    await Store.remove('eventos', ev.id);
    Store.log('exclusao', cantorName(st, me), ownerName(st, ev) + ' ' + fmtDate(ev.date));
    toast('Compromisso excluído');
  };
  const confirmEv = async (ev) => { await Store.update('eventos', ev.id, { status:'confirmado' }); toast('Confirmado ✅'); };

  return html`<${Sheet} title=${fmtDateLong(date)} onClose=${onClose}>
    <div style=${{display:'grid', gap:'10px'}}>
      ${own.length === 0 && busy.length === 0 && html`<div class="okbox">${g ? '🟢 Data livre — todos os integrantes estão disponíveis.' : '🟢 Nenhum compromisso nesse dia.'}</div>`}
      ${own.map(ev => {
        const p = PER[ev.period] || PER.dia;
        const parts = participantsOf(st, ev);
        return html`<div key=${ev.id} class="ev" style=${{borderLeftColor: ownerColor(st, ev)}}>
          <div style=${{fontWeight:800, fontSize:'15.5px'}}>${ev.kind === 'bloqueio' ? '🚫 ' + (ev.place || 'Compromisso pessoal') : ownerName(st, ev)}</div>
          <div class="muted" style=${{marginTop:'3px'}}>${p.ic} ${p.label}${ev.time ? ' · ' + ev.time : ''}</div>
          ${ev.kind !== 'bloqueio' && ev.place && html`<div class="muted">📍 ${ev.place}</div>`}
          ${ev.notes && html`<div class="muted">📝 ${ev.notes}</div>`}
          ${ev.ownerType === 'grupo' && html`<div class="dim" style=${{marginTop:'4px'}}>👥 ${parts.map(l => cantorName(st, l)).join(', ')}${(ev.excluded||[]).length ? ' · substituído(s): ' + ev.excluded.map(l => cantorName(st, l)).join(', ') : ''}</div>`}
          <div class="row" style=${{marginTop:'6px', flexWrap:'wrap', gap:'6px'}}>
            ${ev.status === 'pendente' ? html`<span class="sync" style=${{background:'rgba(245,158,11,.15)', color:'#fcd34d'}}>🟡 A confirmar</span>` : ev.kind !== 'bloqueio' ? html`<span class="sync" style=${{background:'rgba(59,130,246,.18)', color:'#93c5fd'}}>🔵 Confirmado</span>` : null}
            <span class="dim">marcado por ${cantorName(st, ev.createdBy)}</span>
          </div>
          ${canTouch(ev) && html`<div class="row" style=${{marginTop:'10px', gap:'6px'}}>
            ${ev.status === 'pendente' && html`<button class="btn2 btn-green" style=${{flex:1}} onClick=${() => confirmEv(ev)}>✅ Confirmar</button>`}
            <button class="btn2" style=${{flex:1}} onClick=${() => onEdit(ev)}>✏️ Editar</button>
            <button class="btn2 btn-red" style=${{flex:1}} onClick=${() => del(ev)}>🗑️ Excluir</button>
          </div>`}
        </div>`;
      })}
      ${busy.length > 0 && html`<div class="err">
        <div style=${{fontWeight:800, marginBottom:'4px'}}>🔴 Integrante ocupado nesse dia</div>
        ${busy.map((b,i) => html`<div key=${i}>• <b>${cantorName(st, b.login)}</b> — ${describeEv(st, b.ev)}</div>`)}
      </div>`}
      ${!readOnly && html`<div class="row" style=${{marginTop:'4px'}}>
        <button class="btn" onClick=${() => onNew({})}>➕ Agendar neste dia</button>
        ${ctx.type === 'pessoa' && html`<button class="btn2" style=${{whiteSpace:'nowrap'}} onClick=${() => onNew({ bloqueio:true })}>🚫 Bloquear</button>`}
      </div>`}
    </div>
  </${Sheet}>`;
}

// ---------- FORMULÁRIO DE AGENDAMENTO ----------
function EventForm({ me, init, onClose }) {
  const st = useStore();
  const editing = init.ev || null;
  const isBlock = editing ? editing.kind === 'bloqueio' : !!init.bloqueio;
  const groups = myGroups(st, me);
  const defOwner = editing ? (editing.ownerType === 'grupo' ? editing.ownerId : 'solo') : (init.ctx?.type === 'grupo' ? init.ctx.id : 'solo');
  const [owner, setOwner] = useState(defOwner);
  const [date, setDate] = useState(editing?.date || init.date || todayStr());
  const [period, setPeriod] = useState(editing?.period || 'noite');
  const [time, setTime] = useState(editing?.time || '');
  const [place, setPlace] = useState(editing?.place || '');
  const [notes, setNotes] = useState(editing?.notes || '');
  const [status, setStatus] = useState(editing?.status || 'confirmado');
  const [ask, setAsk] = useState(null);
  const [err, setErr] = useState('');

  const g = owner !== 'solo' ? st.grupos[owner] : null;
  const who = isBlock || !g ? [me] : (g.members||[]);
  const conflicts = conflictsFor(st, who, date, period, editing?.id);

  // Outros grupos que vão ficar indisponíveis por causa desse compromisso (pra mostrar o aviso).
  const affected = useMemo(() => {
    const out = [];
    activeGrupos(st).forEach(x => {
      if (x.id === owner) return;
      const hit = (x.members||[]).filter(m => who.includes(m));
      if (hit.length) out.push({ g:x, hit });
    });
    return out;
  }, [st, owner, who.join(',')]);

  const save = async (excluded) => {
    setErr('');
    if (!date) return setErr('Escolha a data.');
    const base = editing || { id: uid('ev'), createdBy: me, createdAt: Date.now() };
    const ev = {
      ...base,
      kind: isBlock ? 'bloqueio' : 'apresentacao',
      ownerType: isBlock ? 'pessoal' : (g ? 'grupo' : 'solo'),
      ownerId: isBlock || !g ? me : g.id,
      date, period, time: time || '', place: place.trim(), notes: notes.trim(),
      status: isBlock ? 'confirmado' : status,
      excluded: excluded || (editing && g ? (editing.excluded||[]) : []),
    };
    const ok = await Store.set('eventos', ev.id, ev);
    Store.log(editing ? 'edicao' : 'agendamento', cantorName(st, me), (isBlock ? 'Bloqueio' : (g ? g.name : 'Solo')) + ' ' + fmtDate(date));
    toast(ok ? (affected.length ? `Salvo! ${affected.length} grupo(s) avisado(s) 🔔` : 'Salvo na agenda ✅') : 'Salvo no aparelho — vai pra nuvem quando a internet voltar');
    onClose();
  };
  const trySave = () => { if (conflicts.length) setAsk(true); else save(); };
  const conflictLogins = [...new Set(conflicts.map(c => c.login))];

  return html`<${Sheet} title=${editing ? 'Editar compromisso' : isBlock ? 'Bloquear dia' : 'Nova apresentação'} onClose=${onClose}>
    <div style=${{display:'grid', gap:'10px'}}>
      ${err && html`<div class="err">${err}</div>`}
      ${!isBlock && html`<div>
        <div class="lbl" style=${{marginBottom:'8px'}}>Quem vai cantar?</div>
        <div class="chips" style=${{flexWrap:'wrap'}}>
          <button class=${'chip ' + (owner==='solo'?'on':'')} style=${owner==='solo' ? {background:SOLO_COLOR} : null} onClick=${() => setOwner('solo')}>🎙️ Eu (solo)</button>
          ${groups.map(x => html`<button key=${x.id} class=${'chip ' + (owner===x.id?'on':'')} style=${owner===x.id ? {background:x.color} : {borderColor:x.color+'88'}} onClick=${() => setOwner(x.id)}>🎤 ${x.name}</button>`)}
        </div>
      </div>`}
      <div class="lbl">Quando</div>
      <input class="inp" type="date" value=${date} onInput=${e => setDate(e.target.value)} />
      <div class="seg">${PERIODOS.map(p => html`<button key=${p.id} class=${period===p.id?'on':''} onClick=${() => setPeriod(p.id)}>${p.ic} ${p.label}</button>`)}</div>
      ${!isBlock && html`<input class="inp" type="time" value=${time} onInput=${e => setTime(e.target.value)} />`}

      ${conflicts.length ? html`<div class="warnbox">
        <b>⚠️ Conflito nessa data:</b>
        ${conflicts.map((c,i) => html`<div key=${i}>• ${c.login === me ? 'Você' : cantorName(st, c.login)} — ${describeEv(st, c.ev)}</div>`)}
      </div>` : date ? html`<div class="okbox">✅ ${g && !isBlock ? 'Todos os integrantes estão livres' : 'Você está livre'} nesse período.</div>` : null}

      <div class="lbl">${isBlock ? 'Motivo (só você vê o detalhe)' : 'Onde'}</div>
      <input class="inp" placeholder=${isBlock ? 'Ex: viagem, trabalho…' : 'Igreja / local'} value=${place} onInput=${e => setPlace(e.target.value)} />
      ${!isBlock && html`<textarea class="inp" rows="2" placeholder="Observação (música, ensaio, contato…)" value=${notes} onInput=${e => setNotes(e.target.value)}></textarea>`}
      ${!isBlock && html`<div class="seg">
        <button class=${status==='confirmado'?'on':''} onClick=${() => setStatus('confirmado')}>🔵 Confirmado</button>
        <button class=${status==='pendente'?'on':''} onClick=${() => setStatus('pendente')}>🟡 A confirmar</button>
      </div>`}

      ${affected.length > 0 && html`<div class="dim">🔔 Essa data vai ficar <b style=${{color:'#fca5a5'}}>indisponível</b> automaticamente em: ${affected.map(a => a.g.name).join(', ')}.</div>`}

      <button class="btn" onClick=${trySave}>${editing ? 'Salvar alterações' : isBlock ? 'Bloquear dia' : 'Agendar'}</button>
    </div>
    ${ask && html`<${Sheet} title="Tem conflito" onClose=${() => setAsk(null)}>
      <div style=${{display:'grid', gap:'10px'}}>
        <div class="warnbox">${conflictLogins.map(l => l === me ? 'Você' : cantorName(st, l)).join(', ')} já ${conflictLogins.length > 1 ? 'têm' : 'tem'} compromisso nesse período.</div>
        <button class="btn2" onClick=${() => setAsk(null)}>📅 Escolher outra data</button>
        ${g && !isBlock && conflictLogins.length < (g.members||[]).length && html`<button class="btn2" onClick=${() => save(conflictLogins)}>🔁 Agendar com substituto (sem ${conflictLogins.map(l => cantorName(st, l)).join(', ')})</button>`}
        <button class="btn2 btn-red" onClick=${() => save()}>Agendar mesmo assim</button>
      </div>
    </${Sheet}>`}
  </${Sheet}>`;
}

function GroupsView({ me, openAgenda }) {

  return html`<div class="fade-up" style=${{display:'grid', gap:'12px'}}>
    <button class="btn" onClick=${() => setEdit({})}>➕ Criar grupo</button>

    <div class="list">
      ${groups.map(g => { const n = nextOf(g); return html`<button key=${g.id} class="item" style=${{borderLeft:'5px solid ' + g.color}} onClick=${() => setOpen(g.id)}>

        <div style=${{flex:1, minWidth:0}}>

          <div class="dim">${g.tipo} · ${(g.members||[]).map(m => cantorName(st, m).split(' ')[0]).join(', ')}</div>

        </div>
        <div style=${{fontSize:'20px', color:'var(--text-dim)'}}>›</div>
      </button>`; })}
    </div>
    ${open && st.grupos[open] && html`<${GroupSheet} me=${me} g=${st.grupos[open]} onClose=${() => setOpen(null)} onEdit=${() => { setEdit(st.grupos[open]); setOpen(null); }} onAgenda=${() => { openAgenda({ type:'grupo', id:open }); setOpen(null); }} />`}
    ${edit && html`<${GroupForm} me=${me} g=${edit.id ? edit : null} onClose=${() => setEdit(null)} />`}
  </div>`;
}

function GroupForm({ me, g, onClose }) {
  const st = useStore();
  const [name, setName] = useState(g?.name || '');
  const [tipo, setTipo] = useState(g?.tipo || 'Quarteto');
  const [color, setColor] = useState(g?.color || CORES[activeGrupos(st).length % CORES.length]);
  const [err, setErr] = useState('');
  const save = async () => {
    if (!name.trim()) return setErr('Dê um nome pro grupo.');
    if (g) { await Store.update('grupos', g.id, { name: name.trim(), tipo, color }); toast('Grupo atualizado'); }
    else {
      const id = uid('gr');
      await Store.set('grupos', id, { name: name.trim(), tipo, color, members:[me], leader: me, createdBy: me, createdAt: Date.now(), removed:false });
      Store.log('grupo', cantorName(st, me), 'criou ' + name.trim());
      toast('Grupo criado! Agora adicione os integrantes 🎤');
    }
    onClose();
  };
  return html`<${Sheet} title=${g ? 'Editar grupo' : 'Novo grupo'} onClose=${onClose}>
    <div style=${{display:'grid', gap:'10px'}}>
      ${err && html`<div class="err">${err}</div>`}
      <input class="inp" placeholder="Nome do grupo" value=${name} onInput=${e => setName(e.target.value)} autoFocus />
      <div class="lbl">Tipo</div>
      <div class="chips" style=${{flexWrap:'wrap'}}>${TIPOS.map(t => html`<button key=${t} class=${'chip ' + (tipo===t?'on':'')} style=${tipo===t ? {background:'linear-gradient(135deg,var(--accent-1),var(--accent-2))'} : null} onClick=${() => setTipo(t)}>${t}</button>`)}</div>
      <div class="lbl">Cor na agenda</div>
      <div class="row" style=${{flexWrap:'wrap', gap:'8px'}}>${CORES.map(c => html`<button key=${c} onClick=${() => setColor(c)} style=${{width:'36px', height:'36px', borderRadius:'50%', background:c, border: color===c ? '3px solid #fff' : '3px solid transparent'}}></button>`)}</div>
      <button class="btn" onClick=${save}>${g ? 'Salvar' : 'Criar grupo'}</button>
    </div>
  </${Sheet}>`;
}

function GroupSheet({ me, g, onClose, onEdit, onAgenda }) {
  const st = useStore();
  const [adding, setAdding] = useState(false);
  const [q, setQ] = useState('');
  const isLeader = g.leader === me;
  const members = (g.members||[]);
  const candidates = activeCantores(st).filter(c => !members.includes(c.id) && (!q || c.name.toLowerCase().includes(q.toLowerCase()))).sort((a,b) => a.name.localeCompare(b.name,'pt-BR'));
  const add = async (login) => { await Store.update('grupos', g.id, { members: [...members, login] }); toast(cantorName(st, login) + ' entrou no grupo'); Store.log('integrante', cantorName(st, me), cantorName(st, login) + ' → ' + g.name); };
  const removeM = async (login) => {
    const self = login === me;
    if (!confirm(self ? 'Sair do grupo ' + g.name + '?' : 'Tirar ' + cantorName(st, login) + ' do grupo?')) return;
    const next = members.filter(m => m !== login);
    const fields = { members: next };
    if (g.leader === login && next.length) fields.leader = next[0];
    await Store.update('grupos', g.id, fields);
    if (self) onClose();
  };
  const delGroup = async () => {
    if (!confirm('Apagar o grupo ' + g.name + '? As apresentações dele também somem da agenda.')) return;
    await Store.update('grupos', g.id, { removed:true });
    allEvents(st).filter(e => e.ownerType === 'grupo' && e.ownerId === g.id).forEach(e => Store.remove('eventos', e.id));
    Store.log('grupo', cantorName(st, me), 'apagou ' + g.name);
    onClose();
  };
  return html`<${Sheet} title=${g.name} onClose=${onClose}>
    <div style=${{display:'grid', gap:'12px'}}>
      <div class="row">
        <button class="btn" style=${{background:g.color}} onClick=${onAgenda}>📅 Ver agenda do grupo</button>
        <button class="btn2" onClick=${onEdit}>✏️</button>
      </div>
      <div class="lbl">Integrantes (${members.length})</div>
      <div class="list">${members.map(m => { const c = st.cantores[m]; const wa = c && waLink(c.phone, 'Olá ' + (c.name||'').split(' ')[0] + '! Sobre o ' + g.name + ':'); return html`<div key=${m} class="item">
        <${Avatar} name=${cantorName(st, m)} />
        <div style=${{flex:1}}>
          <div style=${{fontWeight:700}}>${cantorName(st, m)}${m === me ? ' (você)' : ''}</div>
          <div class="dim">${g.leader === m ? '⭐ Responsável' : 'Integrante'}</div>
        </div>
        ${wa && m !== me && html`<a href=${wa} target="_blank" class="btn2" style=${{textDecoration:'none', padding:'8px 10px'}}>💬</a>`}
        ${(isLeader || m === me) && html`<button class="btn2 btn-red" style=${{padding:'8px 10px'}} onClick=${() => removeM(m)}>${m === me ? 'Sair' : '✕'}</button>`}
      </div>`; })}</div>
      ${adding ? html`<div style=${{display:'grid', gap:'8px'}}>
        <input class="inp" placeholder="Buscar cantor pelo nome…" value=${q} onInput=${e => setQ(e.target.value)} autoFocus />
        <div class="list" style=${{maxHeight:'40vh', overflowY:'auto'}}>
          ${candidates.map(c => html`<button key=${c.id} class="item" onClick=${() => add(c.id)}>
            <${Avatar} name=${c.name} size=${30} /><div style=${{flex:1, fontWeight:700}}>${c.name}</div><div style=${{color:'var(--ok)', fontWeight:800}}>＋</div>
          </button>`)}
          ${candidates.length === 0 && html`<div class="dim">Ninguém encontrado. A pessoa precisa criar a conta dela no app primeiro.</div>`}
        </div>
        <button class="btn2" onClick=${() => { setAdding(false); setQ(''); }}>Pronto</button>
      </div>` : html`<button class="btn2 btn-green" onClick=${() => setAdding(true)}>➕ Adicionar integrante</button>`}
      ${isLeader && html`<button class="btn2 btn-red" onClick=${delGroup}>🗑️ Apagar grupo</button>`}
    </div>
  </${Sheet}>`;
}

    ${avisos.map(a => html`<button key=${a.id} class="item" onClick=${() => openDay(a)} style=${{borderLeft:'5px solid ' + (a.kind === 'novo' ? a.g.color : 'var(--busy)'), background: a.at > seen ? 'rgba(236,72,153,.08)' : undefined}}>
      <div style=${{fontSize:'22px'}}>${a.kind === 'novo' ? '📅' : '🔴'}</div>
      <div style=${{flex:1}}>
        ${a.kind === 'novo'
          ? html`<div style=${{fontWeight:800}}>${a.g.name}: nova apresentação</div>
                 <div class="dim">${fmtDateLong(a.ev.date)} · ${PER[a.ev.period]?.label}${a.ev.place ? ' · ' + a.ev.place : ''} — marcado por ${cantorName(st, a.ev.createdBy)}</div>`
          : html`<div style=${{fontWeight:800}}>${a.g.name} indisponível em ${fmtDate(a.ev.date)}</div>
                 <div class="dim">${a.who.map(w => cantorName(st, w)).join(', ')} ${a.who.length > 1 ? 'estão' : 'está'} em: ${ownerName(st, a.ev)} (${PER[a.ev.period]?.label})</div>`}
      </div>
      ${a.at > seen && html`<span class="dot" style=${{background:'var(--accent-1)', width:'9px', height:'9px'}}></span>`}
    </button>`)}
  </div>`;
}

// ---------- PERFIL ----------
function ProfileView({ me, onLogout, installPrompt }) {
  const st = useStore();
  const c = st.cantores[me] || {};
  const [name, setName] = useState(c.name || '');
  const [phone, setPhone] = useState(c.phone || '');
  const [np, setNp] = useState('');
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  // Salva sozinho: 0,8s depois de parar de digitar.
  useEffect(() => {
    if (name === (c.name||'') && phone === (c.phone||'')) return;
    const t = setTimeout(() => { if (name.trim()) { Store.update('cantores', me, { name: name.trim(), phone: phone.trim() }); toast('Salvo ✅'); } }, 800);
    return () => clearTimeout(t);
  }, [name, phone]);
  return html`<div class="fade-up" style=${{display:'grid', gap:'12px'}}>
    <div class="glass card" style=${{display:'grid', gap:'10px'}}>
      <div class="row"><${Avatar} name=${name} size=${52} /><div><div style=${{fontWeight:800, fontSize:'17px'}}>${name}</div><div class="dim">@${me}</div></div></div>
      <div class="lbl">Nome</div>
      <input class="inp" value=${name} onInput=${e => setName(e.target.value)} />
      <div class="lbl">WhatsApp</div>
      <input class="inp" inputmode="tel" value=${phone} onInput=${e => setPhone(e.target.value)} />
      <div class="dim">As mudanças salvam sozinhas.</div>
    </div>
    <div class="glass card" style=${{display:'grid', gap:'10px'}}>
      <div class="lbl">Trocar senha</div>
      <${PasswordInput} value=${np} onChange=${setNp} placeholder="Nova senha" />
      <button class="btn2" disabled=${np.length < 4} onClick=${async () => { await Store.update('cantores', me, { passHash: simpleHash(np) }); setNp(''); toast('Senha trocada ✅'); }}>Salvar nova senha</button>
    </div>
    ${!standalone && html`<div class="glass card" style=${{display:'grid', gap:'8px'}}>
      <div style=${{fontWeight:800}}>📲 Instalar no celular</div>
      ${installPrompt ? html`<button class="btn" onClick=${() => installPrompt.prompt()}>Instalar Agenda Musical</button>`
        : isIOS ? html`<div class="muted">No iPhone: toque em <b>Compartilhar</b> (quadrado com seta) → <b>Adicionar à Tela de Início</b>.</div>`
        : html`<div class="muted">No Android: toque nos <b>3 pontinhos</b> do navegador → <b>Instalar app</b> (ou "Adicionar à tela inicial").</div>`}
    </div>`}
    <button class="btn2 btn-red" onClick=${onLogout}>Sair da conta</button>
    <div class="dim" style=${{textAlign:'center'}}>Agenda Musical · v${APP_VERSION}</div>
  </div>`;
}

// ---------- PAINEL DO DESENVOLVEDOR ----------
function DevView() {
  const st = useStore();
  const status = useStatus();
  const [tab, setTab] = useState('cantores');
  const [q, setQ] = useState('');
  const cantores = Object.values(st.cantores).sort((a,b) => (a.name||'').localeCompare(b.name||'','pt-BR'));
  const grupos = Object.values(st.grupos).sort((a,b) => (a.name||'').localeCompare(b.name||'','pt-BR'));
  const eventos = allEvents(st);
  const logs = Object.values(st.log).sort((a,b) => (b.at||0) - (a.at||0)).slice(0, 80);
  const ql = q.toLowerCase();
  const futuro = eventos.filter(e => e.date >= todayStr()).length;

  const resetPass = async (c) => {
    const np = prompt('Nova senha para ' + c.name + ':');
    if (!np || np.length < 4) return;
    await Store.update('cantores', c.id, { passHash: simpleHash(np) });
    Store.log('senha', 'Desenvolvedor', 'redefiniu senha de ' + c.name);
    toast('Senha redefinida');
  };
  const exportJson = () => {
    const blob = new Blob([JSON.stringify({ exportadoEm: new Date().toISOString(), versao: APP_VERSION, cantores: st.cantores, grupos: st.grupos, eventos: st.eventos }, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'agenda-musical-backup-' + todayStr() + '.json'; a.click();
  };
  const fmtAt = (t) => { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const LOGIC = { login:'🔓', cadastro:'🆕', agendamento:'📅', edicao:'✏️', exclusao:'🗑️', grupo:'🎤', integrante:'👥', senha:'🔑', admin:'🛠️' };

  return html`<div class="fade-up" style=${{display:'grid', gap:'12px'}}>
    <div class="glass card">
      <div class="row" style=${{justifyContent:'space-between'}}><div style=${{fontWeight:800}}>🔑 Painel do Desenvolvedor</div><${SyncBadge} /></div>
      <div style=${{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:'8px', marginTop:'12px', textAlign:'center'}}>
        ${[['Cantores', activeCantores(st).length], ['Grupos', activeGrupos(st).length], ['Agendados', futuro], ['Total', eventos.length]].map(([l, n]) => html`<div key=${l} style=${{padding:'10px 4px', borderRadius:'12px', background:'rgba(148,163,184,.08)'}}>
          <div style=${{fontSize:'22px', fontWeight:900}} class="grad-text">${n}</div><div class="dim">${l}</div></div>`)}
      </div>
      <button class="btn2" style=${{width:'100%', marginTop:'10px'}} onClick=${exportJson}>💾 Baixar backup (JSON)</button>
    </div>
    <div class="seg">
      <button class=${tab==='cantores'?'on':''} onClick=${() => setTab('cantores')}>Cantores</button>
      <button class=${tab==='grupos'?'on':''} onClick=${() => setTab('grupos')}>Grupos</button>
      <button class=${tab==='log'?'on':''} onClick=${() => setTab('log')}>Histórico</button>
    </div>
    ${tab !== 'log' && html`<input class="inp" placeholder="🔎 Buscar…" value=${q} onInput=${e => setQ(e.target.value)} />`}
    ${tab === 'cantores' && html`<div class="list">${cantores.filter(c => !q || (c.name||'').toLowerCase().includes(ql)).map(c => html`<div key=${c.id} class="item" style=${{flexWrap:'wrap', opacity: c.removed ? .5 : 1}}>
      <${Avatar} name=${c.name} />
      <div style=${{flex:1, minWidth:'140px'}}>
        <div style=${{fontWeight:800}}>${c.name} ${c.removed ? '· removido' : c.paused ? '· ⏸️ pausado' : ''}</div>
        <div class="dim">@${c.id} · ${c.phone || 'sem WhatsApp'} · ${myGroups(st, c.id).length} grupo(s) · ${eventsOfPerson(st, c.id).length} compromisso(s)</div>
      </div>
      <div class="row" style=${{gap:'6px'}}>
        <button class="btn2" style=${{padding:'7px 9px'}} title="Redefinir senha" onClick=${() => resetPass(c)}>🔑</button>
        ${!c.removed && html`<button class="btn2" style=${{padding:'7px 9px'}} title="Pausar/Reativar" onClick=${() => { Store.update('cantores', c.id, { paused: !c.paused }); Store.log('admin', 'Desenvolvedor', (c.paused ? 'reativou ' : 'pausou ') + c.name); }}>${c.paused ? '▶️' : '⏸️'}</button>`}
        <button class="btn2 btn-red" style=${{padding:'7px 9px'}} title=${c.removed ? 'Restaurar' : 'Remover'} onClick=${() => { if (c.removed || confirm('Remover ' + c.name + '? Ele some da lista de login (dá pra restaurar depois).')) { Store.update('cantores', c.id, { removed: !c.removed }); Store.log('admin', 'Desenvolvedor', (c.removed ? 'restaurou ' : 'removeu ') + c.name); } }}>${c.removed ? '♻️' : '🗑️'}</button>
      </div>
    </div>`)}</div>`}
    ${tab === 'grupos' && html`<div class="list">${grupos.filter(g => !q || (g.name||'').toLowerCase().includes(ql)).map(g => html`<div key=${g.id} class="item" style=${{borderLeft:'5px solid '+g.color, opacity: g.removed ? .5 : 1}}>
      <div style=${{flex:1}}>
        <div style=${{fontWeight:800}}>${g.name} ${g.removed ? '· apagado' : ''}</div>
        <div class="dim">${g.tipo} · ${(g.members||[]).map(m => cantorName(st, m)).join(', ')}</div>
      </div>
      <button class="btn2 btn-red" style=${{padding:'7px 9px'}} onClick=${() => { if (g.removed || confirm('Apagar o grupo ' + g.name + '?')) Store.update('grupos', g.id, { removed: !g.removed }); }}>${g.removed ? '♻️' : '🗑️'}</button>
    </div>`)}</div>`}
    ${tab === 'log' && html`<div class="glass card"><table class="t"><tbody>${logs.map(l => html`<tr key=${l.id}>
      <td style=${{width:'26px'}}>${LOGIC[l.type] || '•'}</td>
      <td><b>${l.who}</b> <span class="muted">${l.detail}</span></td>
      <td class="dim" style=${{textAlign:'right', whiteSpace:'nowrap'}}>${fmtAt(l.at)}</td>
    </tr>`)}</tbody></table>${logs.length === 0 && html`<div class="dim">Sem registros ainda.</div>`}</div>`}
  </div>`;
}

// ---------- APP ----------
function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; }
}

function App() {
  const st = useStore();
  const [session, setSession] = useState(loadSession);
  const [tab, setTab] = useState(() => session?.dev ? 'dev' : 'agenda');
  const [ctx, setCtx] = useState(() => ({ type:'pessoa', login: session?.login }));
  const [msg, setMsg] = useState('');
  const [installPrompt, setInstallPrompt] = useState(null);
  const [avisoDay, setAvisoDay] = useState(null);
  const tRef = useRef();
  toastFn = (m) => { setMsg(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setMsg(''), 2600); };

  useEffect(() => {
    const h = (e) => { e.preventDefault(); setInstallPrompt(e); };
    window.addEventListener('beforeinstallprompt', h);
    return () => window.removeEventListener('beforeinstallprompt', h);
  }, []);

  const me = session?.login || null;
  const avisos = useMemo(() => buildAvisos(st, me), [st, me]);
  const seenAt = Number((me && localStorage.getItem(SEEN_KEY + me)) || 0);
  const unread = tab === 'avisos' ? 0 : avisos.filter(a => a.at > seenAt).length;

  // Se o cantor foi removido/pausado pelo desenvolvedor, sai sozinho.
  useEffect(() => {
    if (!me) return;
    const c = st.cantores[me];
    if (c && (c.removed || c.paused)) logout();
  }, [st.cantores, me]);
  // Se o grupo selecionado foi apagado ou a pessoa saiu dele, volta pra agenda pessoal.
  useEffect(() => {
    if (ctx.type === 'grupo' && me && !myGroups(st, me).some(g => g.id === ctx.id)) setCtx({ type:'pessoa', login: me });
  }, [st.grupos]);

  const login = (s, remember) => {
    try { (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify(s)); } catch(e) {}
    setSession(s); setTab(s.dev ? 'dev' : 'agenda'); setCtx({ type:'pessoa', login: s.login });
  };
  function logout() {
    try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
    setSession(null);
  }

  if (!session) return html`<${LoginScreen} onLogin=${login} /><${Toast} msg=${msg} />`;

  const tabs = session.dev
    ? [['dev','🔑','Painel'], ['todos','🌐','Todos']]
    : [['agenda','📅','Agenda'], ['grupos','🎤','Grupos'], ['todos','🌐','Todos'], ['avisos','🔔','Avisos'], ['perfil','👤','Perfil']];
  const title = session.dev ? 'Desenvolvedor' : (cantorName(st, me) || '').split(' ')[0];

  return html`
    <div class="app">
      <div class="topbar">
        <div class="logo">🎶</div>
        <div style=${{flex:1, minWidth:0}}>
          <div class="grad-text" style=${{fontWeight:900, fontSize:'17px'}}>Agenda Musical</div>
          <div class="dim">Olá, ${title}</div>
        </div>
        <${SyncBadge} />
        ${session.dev && html`<button class="btn2" style=${{padding:'7px 10px'}} onClick=${logout}>Sair</button>`}
      </div>

      ${tab === 'agenda' && html`<${AgendaView} me=${me} ctx=${ctx} setCtx=${setCtx} showChips=${true} />`}
      ${tab === 'grupos' && html`<${GroupsView} me=${me} openAgenda=${(c) => { setCtx(c); setTab('agenda'); }} />`}
      ${tab === 'todos' && html`<${AllView} me=${me} />`}
      ${tab === 'avisos' && html`<${AvisosView} me=${me} avisos=${avisos} openDay=${(a) => setAvisoDay(a)} />`}
      ${tab === 'perfil' && html`<${ProfileView} me=${me} onLogout=${logout} installPrompt=${installPrompt} />`}
      ${tab === 'dev' && html`<${DevView} />`}

      ${avisoDay && html`<${DaySheet} me=${me} ctx=${{ type:'grupo', id: avisoDay.g.id }} date=${avisoDay.ev.date} readOnly=${true} onClose=${() => setAvisoDay(null)} onNew=${() => {}} onEdit=${() => {}} />`}

      <div class="nav"><div class="nav-in glass">
        ${tabs.map(([id, ic, label]) => html`<button key=${id} class=${tab===id?'on':''} onClick=${() => setTab(id)}>
          <span class="ic">${ic}</span>${label}
          ${id === 'avisos' && unread > 0 && html`<span class="badge">${unread}</span>`}
        </button>`)}
      </div></div>
      <${Toast} msg=${msg} />
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
